plugins { id 'com.android.application' }
android {
    namespace 'com.cathome.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cathome.game'
        minSdk 23
        targetSdk 35
        versionCode 13
        versionName '0.13-skin-atelier'
    }
    signingConfigs {
        debug {
            def savedDebugKey = System.getenv('CATHOME_DEBUG_KEYSTORE')
            if (savedDebugKey) {
                storeFile file(savedDebugKey)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes { release { minifyEnabled false } }
}
