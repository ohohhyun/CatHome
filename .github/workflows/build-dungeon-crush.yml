name: Build Dungeon Crush APK
on:
  workflow_dispatch:
  push:
    branches: [main, codex/ashen-rift-apk]
    paths:
      - 'dungeon-crush/**'
      - '.github/workflows/build-dungeon-crush.yml' 
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dungeon-crush
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unpack bundled offline game art
        run: node tools/unpack-art.cjs
      - name: Package verified existing CC0 music and effects
        run: python3 tools/fetch-audio.py
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Gradle Wrapper
        run: echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Preserve test APK signing key
        uses: actions/cache@v4
        with:
          path: .signing/debug.keystore
          key: cathome-debug-signing-explicit-v1
      - name: Prepare reusable test signing key
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.signing"
          if [ ! -f "$GITHUB_WORKSPACE/.signing/debug.keystore" ]; then
            keytool -genkeypair -keystore "$GITHUB_WORKSPACE/.signing/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Check combat and campaign
        run: |
          node tests/premium.test.cjs
          node tests/premium-art.test.cjs
          node tests/background-cache.test.cjs
          node tests/frontier.test.cjs
          node tests/game.test.cjs
          node tests/caster.test.cjs
          node tests/ranged.test.cjs
          node tests/navigation.test.cjs
          node tests/generated-art.test.cjs
          node tests/combat-timing.test.cjs
          node tests/rpg.test.cjs
          node tests/inventory.test.cjs
          node tests/equipment-services.test.cjs
          node tests/release.test.cjs
          node tests/rankings.test.cjs
          node tests/ranking-client.test.cjs
          node tests/sound.test.cjs
          node tests/font-coverage.test.cjs
          node tests/ui-layout.test.cjs
          node tests/party-recovery.test.cjs
          node tests/run-cast-fix.test.cjs
          node tests/new-content.test.cjs
          node tests/expansion.test.cjs
          node tests/hotfix.test.cjs
      - name: Test native four-player LAN transport
        run: |
          mkdir -p build/lan-test
          javac -d build/lan-test app/src/main/java/com/dungeoncrush/game/LanTransport.java tests/LanTransportTest.java
          java -cp build/lan-test LanTransportTest
          javac -d build/lan-test app/src/main/java/com/dungeoncrush/game/RankingHttpClient.java tests/RankingHttpClientTest.java
          java -cp build/lan-test RankingHttpClientTest
      - name: Install UI test library
        run: npm install --prefix "$RUNNER_TEMP/cathome-ui" --no-package-lock --no-audit --no-fund playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install video encoder for real combat capture
        run: node "$RUNNER_TEMP/cathome-ui/node_modules/playwright/cli.js" install ffmpeg
      - name: Compare every equipped costume against the basic character body
        run: node tests/premium-size-presentation.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Inspect premium store, all outfit motions and pets
        run: node tests/premium-presentation.test.cjs
        env:
          DUNGEON_PREMIUM_VIDEO: '1'
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Inspect premium alpha, effects, multiplayer and asset recovery
        run: node tests/premium-rendering.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Verify equipment taps, comparisons and town NPC services
        run: node tests/town-services.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Verify backup recovery and launch safety
        run: node tests/release-presentation.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Verify ranking menu, local records and future server adapter
        run: node tests/rankings-presentation.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Verify town shortcuts, menu flows and enlarged text
        run: node tests/navigation-presentation.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Inspect expanded dungeons, elite raids, backgrounds and monster effects
        run: node tests/frontier-presentation.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Verify combat voices, skill sounds and boss music
        run: node tests/sound-presentation.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Audit inventory controls and text throughout the game
        run: node tests/inventory-ui.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Verify new mage, regional bosses and right-item sale confirmation
        run: node tests/new-content-presentation.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Verify configurable skill slots, anchored dialogs and four-peer free-for-all
        run: node tests/expansion-presentation.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Verify enemy facing, sprite alpha, fixed basic attack, run appearance and readable controls
        run: node tests/hotfix-presentation.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Verify cold jump/dash and actual run torso pixels
        run: node tests/coherent-motion-presentation.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Verify equal anatomical size across action changes
        run: node tests/actor-size-presentation.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Test run clarity, extended skills and dead-caster cancellation
        run: node tests/run-skill-presentation.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - name: Test four-player game protocol and mobile layout
        run: |
          test_status=0
          for scenario in motion24-presentation generated-presentation exploration locomotion ranged-presentation combat-presentation layout presentation browser party-recovery-presentation; do
            node "tests/$scenario.test.cjs" || test_status=1
          done
          exit "$test_status"
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-Advanced-Previews
          path: |
            dungeon-crush/build/previews/advanced-basic-*.png
            dungeon-crush/build/previews/advanced-run-*.png
            dungeon-crush/build/previews/advanced-jump-*.png
            dungeon-crush/build/previews/advanced-skill-*-6.png
            dungeon-crush/build/previews/advanced-skill-*-5.png
            dungeon-crush/build/previews/advanced-combat.webm
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-Party-Previews
          path: dungeon-crush/build/previews/party-recovery-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-Navigation-Previews
          path: dungeon-crush/build/previews/navigation-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-Ranged-Previews
          path: |
            dungeon-crush/build/previews/ranged-*.png
            dungeon-crush/build/previews/enemy-slow-orb.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-Previews
          path: dungeon-crush/build/previews/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-Motion24-Previews
          path: |
            dungeon-crush/build/previews/motion24-*.png
            dungeon-crush/build/previews/motion24-comparison.webm
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-RunFix-Previews
          path: |
            dungeon-crush/build/previews/runfix-cruise-*.png
            dungeon-crush/build/previews/runfix-ultimate-*.png
            dungeon-crush/build/previews/runfix-gameplay.webm
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-Coherent-Previews
          path: |
            dungeon-crush/build/previews/coherent-*.png
            dungeon-crush/build/previews/coherent-gameplay.webm
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-Size-Previews
          path: dungeon-crush/build/previews/size-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-Inventory-Previews
          path: dungeon-crush/build/previews/inventory-ui-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-Text-Previews
          path: dungeon-crush/build/previews/text-fit-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-Town-Previews
          path: dungeon-crush/build/previews/town-services-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-Menu-Previews
          path: dungeon-crush/build/previews/menu-split-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-Content-Previews
          path: |
            dungeon-crush/build/previews/new-content-*.png
            dungeon-crush/build/previews/new-content-*.json
            dungeon-crush/build/previews/new-content-aria-combat.webm
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-Frontier-Previews
          path: dungeon-crush/build/previews/frontier-*
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DungeonCrush-Premium-Previews
          path: dungeon-crush/build/previews/premium-*
          if-no-files-found: warn
          retention-days: 30
      - name: Build APK
        run: bash gradlew assembleDebug bundleRelease lintRelease --no-daemon
        env:
          CATHOME_DEBUG_KEYSTORE: ${{ github.workspace }}/.signing/debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: DungeonCrush-Unsigned-Store-AAB
          path: dungeon-crush/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Verify installable APK and signer
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > build/apk-signer.txt
          python3 -c "from pathlib import Path; assert 'Signer #1 certificate SHA-256 digest: e43fedd9099e7b5df82eccfa3e92fc020d429ad99795463abbe40e2af4880708' in Path('build/apk-signer.txt').read_text(), 'APK signer changed; preserve update compatibility'"
          python tools/verify-apk-identity.py "$ANDROID_HOME/build-tools/35.0.0/aapt" app/build/outputs/apk/debug/app-debug.apk com.dungeoncrush.game com.dungeoncrush.game.MainActivity "던전크러시!"
          python tools/verify-bundled-art.py app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DungeonCrush-2.14.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DungeonCrush-APK
          path: dungeon-crush/app/build/outputs/apk/debug/DungeonCrush-2.14.1.apk
          if-no-files-found: error
          retention-days: 30
      - name: Split verified APK for reliable downloads
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from hashlib import sha256
          import json
          p=Path('app/build/outputs/apk/debug/DungeonCrush-2.14.1.apk'); data=p.read_bytes(); out=Path('build/apk-parts');out.mkdir(parents=True,exist_ok=True);parts=[]
          for n,start in enumerate(range(0,len(data),20*1024*1024),1):
              chunk=data[start:start+20*1024*1024];name=f'DungeonCrush-2.14.1.apk.part{n:02}';(out/name).write_bytes(chunk);parts.append(dict(name=name,bytes=len(chunk),sha256=sha256(chunk).hexdigest()))
          assert len(parts)<=24
          (out/'manifest.json').write_text(json.dumps(dict(file=p.name,bytes=len(data),sha256=sha256(data).hexdigest(),parts=parts),indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: DungeonCrush-APK-Manifest
          path: dungeon-crush/build/apk-parts/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DungeonCrush-APK-Part-01
          path: dungeon-crush/build/apk-parts/*.part01
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: DungeonCrush-APK-Part-02
          path: dungeon-crush/build/apk-parts/*.part02
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: DungeonCrush-APK-Part-03
          path: dungeon-crush/build/apk-parts/*.part03
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: DungeonCrush-APK-Part-04
          path: dungeon-crush/build/apk-parts/*.part04
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: DungeonCrush-APK-Part-05
