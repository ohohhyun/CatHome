name: Publish Dungeon Crush direct APK
on:
  workflow_dispatch:
  push:
    branches: [codex/ashen-rift-apk]
    paths: ['.github/workflows/publish-dungeon-crush.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: dungeon-crush-v2.20.3-rc1
      DUNGEON_RELEASE_SOURCE: 12451dfba010ed432a566702cbe2444c86203eb7
      DUNGEON_RELEASE_RUN: '44176222151'
      DUNGEON_RELEASE_ID: '449228943'
      DUNGEON_APK_BYTES: '512926747'
      DUNGEON_APK_SHA256: 062b2211476d5fcaada67fff9e0c6a12fac7a86121fb330bf07fedc783643ec7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 12451dfba010ed432a566702cbe2444c86203eb7
      - name: Require the exact successful build and fixed draft release
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/$DUNGEON_RELEASE_RUN --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/$DUNGEON_RELEASE_RUN --jq .head_sha)" = "$DUNGEON_RELEASE_SOURCE"
          test "$(gh api repos/$GH_REPO/git/ref/tags/$RELEASE_TAG --jq .object.sha)" = "$DUNGEON_RELEASE_SOURCE"
          test "$(gh api repos/$GH_REPO/releases/$DUNGEON_RELEASE_ID --jq .tag_name)" = "$RELEASE_TAG"
          test "$(gh api repos/$GH_REPO/releases/$DUNGEON_RELEASE_ID --jq .draft)" = true
      - uses: actions/download-artifact@v4
        with:
          name: DungeonCrush-APK
          run-id: 44176222151
          github-token: ${{ github.token }}
          path: apk
      - name: Verify and package exact signed APK
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['DUNGEON_RELEASE_SOURCE']
          p=Path('apk/DungeonCrush-2.20.3.apk'); data=p.read_bytes()
          assert len(data)==int(os.environ['DUNGEON_APK_BYTES'])
          assert hashlib.sha256(data).hexdigest()==os.environ['DUNGEON_APK_SHA256']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              for f in Path('dungeon-crush/app/src/main/assets').iterdir():
                  if f.is_file() and f.suffix in ('.js','.css','.html'):assert z.read('assets/'+f.name)==f.read_bytes(),f.name
              assert 'VER 2.20.3' in z.read('assets/index.html').decode()
              for asset in ['art/selection-atrium.webp','art/selection/kael.webp','art/selection/rin.webp','art/selection/bane.webp','art/selection/sera.webp','art/selection/aria.webp','pk.js','pk-ui.js']:assert z.read('assets/'+asset)==Path('dungeon-crush/app/src/main/assets',asset).read_bytes(),asset
              ui=z.read('assets/premium-ui.js').decode()
              assert "['walk'," not in ui and '걷기' not in ui
          guide='던전크러시 2.20.3 (설치 버전 52)\r\n\r\n압축을 풀고 DungeonCrush-2.20.3.apk를 기존 앱 위에 업데이트 설치하세요. 기존 앱을 삭제하지 마세요.\r\n기본6종과 외형30종의 이동을 양발이 번갈아 디디는 전신8포즈로 교체했습니다. 느린 이동과 달리기의 접지 기준을 맞추고 발을 가리던 일반 이동 장식을 제거했습니다. 실제 이동 속도는 유지합니다. 모험가 메뉴12칸의 폭·높이·제목 줄과 마지막 행을 맞췄습니다. 최초 닉네임은 무료 저장, 이후에는 닉네임 변경권1개를 사용해 변경합니다. 변경권은3,900원 상품으로 표시하며 등록된 결제 상품이 없어 현재 구매할 수 없습니다. 무료 테스트 상품으로 변경권을 지급하지 않습니다. 기존 기록과 서명을 유지합니다.\r\n저장 형식 2 / Wi-Fi 프로토콜 12 / 기존 서명을 유지합니다.\r\n검증 빌드: https://github.com/ohohhyun/CatHome/actions/runs/44176222151\r\nAPK SHA-256: '+os.environ['DUNGEON_APK_SHA256']+'\r\n'
          out=Path('DungeonCrush-2.20.3-RC1.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED) as z:
              z.writestr(p.name,data)
              z.writestr('INSTALL-KO.txt',b'\xef\xbb\xbf'+guide.encode())
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read(p.name)).hexdigest()==os.environ['DUNGEON_APK_SHA256']
          meta=dict(file=out.name,bytes=out.stat().st_size,sha256=hashlib.sha256(out.read_bytes()).hexdigest())
          Path('package-verification.json').write_text(json.dumps(meta,indent=2));print(meta)
          PY
      - name: Publish permanent anonymous download
        run: |
          gh release upload "$RELEASE_TAG" DungeonCrush-2.20.3-RC1.zip apk/DungeonCrush-2.20.3.apk --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
      - name: Verify anonymous full download and ZIP integrity
        run: |
          gh api "repos/$GH_REPO/releases/$DUNGEON_RELEASE_ID" > release-assets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('package-verification.json').read_text());r=json.loads(Path('release-assets.json').read_text());assert not r['draft']
          a=next(a for a in r['assets'] if a['name']==m['file']);assert a['size']==m['bytes'] and a['digest']=='sha256:'+m['sha256']
          Path('download-url.txt').write_text(a['browser_download_url'])
          apk=next(a for a in r['assets'] if a['name']=='DungeonCrush-2.20.3.apk');assert apk['size']==int(__import__('os').environ['DUNGEON_APK_BYTES']) and apk['digest']=='sha256:'+__import__('os').environ['DUNGEON_APK_SHA256']
          Path('apk-download-url.txt').write_text(apk['browser_download_url'])
          PY
          curl --fail --location --retry 2 "$(cat download-url.txt)" -o public-download.zip
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          m=json.loads(Path('package-verification.json').read_text());p=Path('public-download.zip')
          assert p.stat().st_size==m['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read('DungeonCrush-2.20.3.apk')).hexdigest()==os.environ['DUNGEON_APK_SHA256']
          print('Verified anonymous download:',Path('download-url.txt').read_text())
          print(m)
          PY
          curl --fail --location --retry 2 "$(cat apk-download-url.txt)" -o public-download.apk
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          p=Path('public-download.apk')
          assert p.stat().st_size==int(os.environ['DUNGEON_APK_BYTES'])
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['DUNGEON_APK_SHA256']
          print('Verified anonymous APK:',Path('apk-download-url.txt').read_text())
          PY
