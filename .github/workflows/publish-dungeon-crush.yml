name: Publish Dungeon Crush direct APK
on:
  workflow_dispatch:
  push:
    branches: [codex/ashen-rift-apk]
    paths: ['.github/workflows/publish-dungeon-crush.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the already verified 2.9 APK
        run: gh run download 42236159924 --name DungeonCrush-APK --dir apk
      - name: Verify exact APK bytes and archive integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          p = Path('apk/DungeonCrush-2.9.apk')
          assert p.stat().st_size == 109022767
          assert sha256(p.read_bytes()).hexdigest() == 'e3120a47911a8c3ff9da1c6bb57f285bc999add3d678ca41751b90b2da81db61'
          with ZipFile(p) as z:
              assert z.testzip() is None
              assert 'AndroidManifest.xml' in z.namelist()
              assert len([n for n in z.namelist() if n.startswith('assets/art/advanced/') and n.endswith('.webp')]) == 5
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion29/') and n.endswith('.webp')]) == 101
              assert len([n for n in z.namelist() if n.startswith('assets/art/generated/') and n.endswith('.png')]) == 0
          print('Verified original signed Dungeon Crush 2.9 APK; no rebuild or repackaging.')
          PY
      - name: Download real combat recording
        run: gh run download 42236159924 --name DungeonCrush-Advanced-Previews --dir previews
      - name: Download motion comparison recording
        run: |
          gh run download 42236159924 --name DungeonCrush-Motion24-Previews --dir motion
          cp motion/motion24-comparison.webm DungeonCrush-2.9-motion-comparison.webm
      - name: Prepare a playable preview
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -hide_banner -loglevel error -y -i previews/advanced-combat.webm -vf 'scale=1280:-2' -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart -an DungeonCrush-2.9-combat.mp4
            echo 'DUNGEON_PREVIEW_FILE=DungeonCrush-2.9-combat.mp4' >> "$GITHUB_ENV"
          else
            cp previews/advanced-combat.webm DungeonCrush-2.9-combat.webm
            echo 'DUNGEON_PREVIEW_FILE=DungeonCrush-2.9-combat.webm' >> "$GITHUB_ENV"
          fi
      - name: Prepare install notes
        run: |
          cat > release-notes.md <<'EOF'
          던전크러시! 2.9 Android 설치 파일입니다.

          Assets에서 DungeonCrush-2.9.apk를 받아 파일을 눌러 설치하세요. 압축을 풀 필요가 없습니다. 기존 2.8과 같은 서명과 별도 앱 ID를 유지합니다. 친구에게 이 릴리스 페이지나 APK 다운로드 링크를 보내면 됩니다.

          - 직업 4종 달리기·점프·회피·3연타·시전: 주요 동작별 24단계 그림, 대기·피격·착지·쓰러짐 포함 704개 자세
          - 몬스터 4종 이동·공격 각 24단계, 총 192개 자세와 기존의 느린 공격 예고 유지
          - 채색 스킬 아이콘 24종, 직업별 각성 이펙트 32장, 칼날·주먹·탄두 궤적과 지면 조명 개선
          - 타격 순간에 맞춘 접촉 자세, 파티 모션 보간, 필요한 동작 중심 로딩과 이미지 메모리 관리
          - 파티 경험치 저장·본인 피해 숫자·가독성 높은 HP·장비 이미지·전투 음원 유지
          - 던전 물약: 최대 HP 50% 회복, 재사용 180초 유지
          - 기존 캐릭터·장비·퀘스트·숙련 저장과 최대 4인 같은 Wi-Fi 협동 유지(프로토콜 6). 파티원도 2.9로 업데이트를 권장합니다.

          전투 영상은 실제 게임을 자동 조작한 브라우저 녹화입니다. 비교 영상은 2.8/2.9 자세를 천천히 나란히 재생합니다. 실제 휴대폰 촬영 영상은 아닙니다. 프레임 수를 던파 대비 객관적 품질 퍼센트로 환산하지 않습니다.

          집사 사절의 원본 코드·빌드 설정은 변경하지 않았습니다.
          검증 빌드: https://github.com/ohohhyun/CatHome/actions/runs/42236159924
          APK SHA256: e3120a47911a8c3ff9da1c6bb57f285bc999add3d678ca41751b90b2da81db61
          EOF
      - name: Publish direct install and combat preview downloads
        run: |
          if gh release view dungeon-crush-v2.9 >/dev/null 2>&1; then
            gh release download dungeon-crush-v2.9 --pattern DungeonCrush-2.9.apk --dir existing
            cmp apk/DungeonCrush-2.9.apk existing/DungeonCrush-2.9.apk
            gh release upload dungeon-crush-v2.9 "$DUNGEON_PREVIEW_FILE" DungeonCrush-2.9-motion-comparison.webm --clobber
          else
            gh release create dungeon-crush-v2.9 apk/DungeonCrush-2.9.apk "$DUNGEON_PREVIEW_FILE" DungeonCrush-2.9-motion-comparison.webm --target "$GITHUB_SHA" --title '던전크러시! 2.9 — 24단계 모션·그래픽 개선' --notes-file release-notes.md --prerelease
          fi
      - name: Confirm release assets
        run: gh release view dungeon-crush-v2.9 --json url,tagName,assets
