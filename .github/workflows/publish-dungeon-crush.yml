name: Publish Dungeon Crush direct APK
on:
  workflow_dispatch:
  push:
    branches: [codex/ashen-rift-apk]
    paths: ['.github/workflows/publish-dungeon-crush.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified 2.9.6 APK and reviewed UI screens
        run: |
          gh run download 42328011453 --name DungeonCrush-APK --dir apk
          gh run download 42328011453 --name DungeonCrush-Menu-Previews --dir previews
      - name: Verify unchanged signed APK bytes and full offline Korean font
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          p=Path('apk/DungeonCrush-2.9.6.apk');data=p.read_bytes()
          assert len(data)==99183081 and sha256(data).hexdigest()=='f4dd62e7e893d8cd7da6a92a5479db55456392b2d4ff94e972b21ec0e4e8b1e8'
          with ZipFile(p) as z:
              assert z.testzip() is None and 'AndroidManifest.xml' in z.namelist()
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion29/') and n.endswith('.webp')])==85
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion292/') and n.endswith('.webp')])==4
              assert len([n for n in z.namelist() if n.startswith('assets/art/advanced/') and n.endswith('.webp')])==5
              assert sha256(z.read('assets/art/rift-ui.otf')).hexdigest()=='a5444ac84938025003b520d937476b2df2889d458c12a5abc9981d03e5510018'
              assert sha256(z.read('assets/art/town-npcs.webp')).hexdigest()=='da8c8a5cc65b7d0cd675a05b362760eaabd28cfa299fc3d2700e1cc4b76c48d2'
              assert 'assets/ui-layout.js' in z.namelist() and 'assets/art/FONT-LICENSE.txt' in z.namelist()
          print('Verified original signed APK and complete offline Korean font; no rebuild/repackaging.')
          PY
      - name: Package verified APK as a shareable ZIP
        run: |
          python3 - apk/DungeonCrush-2.9.6.apk DungeonCrush-2.9.6-Share.zip <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZipInfo,ZIP_STORED
          from hashlib import sha256
          import sys
          apk=Path(sys.argv[1]);output=Path(sys.argv[2]);data=apk.read_bytes();expected='f4dd62e7e893d8cd7da6a92a5479db55456392b2d4ff94e972b21ec0e4e8b1e8'
          assert len(data)==99183081 and sha256(data).hexdigest()==expected
          notes='던전크러시! 2.9.6 설치 및 공유 안내\r\n\r\n1. ZIP 압축을 풉니다.\r\n2. DungeonCrush-2.9.6.apk 파일을 눌러 기존 던전크러시에 업데이트 설치합니다.\r\n3. 기존 캐릭터 기록을 유지하려면 앱을 삭제하지 마세요.\r\n4. 친구도 같은 2.9.6 버전을 설치하세요.\r\n5. 같은 Wi-Fi에 연결하고 한 명이 방을 만든 뒤 친구는 방장 IP와 4자리 코드로 참가합니다.\r\n\r\n집사 사절과 별도로 설치되는 던전크러시 앱입니다.\r\nAPK SHA256: '+expected+'\r\n'
          with ZipFile(output,'w',compression=ZIP_STORED) as z:
              for name,content in [(apk.name,data),('INSTALL-KO.txt',b'\xef\xbb\xbf'+notes.encode('utf-8'))]:
                  item=ZipInfo(name,date_time=(2026,11,7,0,0,0));item.create_system=3;item.external_attr=0o100644<<16;item.compress_type=ZIP_STORED;z.writestr(item,content)
          with ZipFile(output) as z:
              assert z.testzip() is None and z.namelist()==[apk.name,'INSTALL-KO.txt']
              assert sha256(z.read(apk.name)).hexdigest()==expected
          print('Verified share ZIP:',output.name,output.stat().st_size,sha256(output.read_bytes()).hexdigest())
          PY
      - name: Prepare reviewed inventory and HUD images
        run: |
          mkdir ui
          cp previews/menu-split-1280-inventory.png ui/DungeonCrush-2.9.6-Inventory.png
          cp previews/menu-split-1280-shop.png ui/DungeonCrush-2.9.6-Shop.png
          cp previews/menu-split-1280-quests.png ui/DungeonCrush-2.9.6-Quests.png
          cp previews/menu-split-1280-forge.png ui/DungeonCrush-2.9.6-Forge.png
          cp previews/menu-split-1280-skills.png ui/DungeonCrush-2.9.6-Skills.png
          cp previews/menu-split-640-shop.png ui/DungeonCrush-2.9.6-Compact.png
      - name: Prepare install notes
        run: |
          cat > release-notes.md <<'EOF'
          던전크러시! 2.9.6 좌측 설명·우측 목록 메뉴 개선 APK입니다.

          설치: DungeonCrush-2.9.6.apk를 눌러 기존 앱에 업데이트하세요. 기존 앱을 삭제하지 않으면 캐릭터 기록이 유지됩니다.
          공유: ZIP 압축을 푼 뒤 안의 APK를 설치하세요.

          - 상점·가방·강화·제작·스킬·퀘스트를 좌측 메뉴/설명과 우측 목록/선택으로 나눴습니다. 짧은 휴대폰 화면에서도 위아래로 바뀌지 않으며 양쪽을 따로 스크롤합니다.
          - 가방 필터·착용 정보·장비 설명을 왼쪽으로 모으고 오른쪽에는 장비 목록과 선택 동작을 배치했습니다. 기존 탭 장착/해제·교체와 길게 눌러 비교를 유지합니다.
          - 상점 아이템 그림을 선택하면 왼쪽에서 옵션·가격을 확인하고 오른쪽에서 구매합니다. 강화 대상과 제작은 각각 독립된 목록에서 선택합니다.
          - 퀘스트는 메인·일일·기록 필터, 진행 상태와 목표 막대, 보상 아이콘과 보고/수령 버튼을 갖춘 카드 목록으로 정리했습니다.
          - 원정 종류·던전 선택·장비 비교·도움말·설정·파티·일시정지·정산도 설명은 왼쪽, 비교/설정/행동은 오른쪽으로 배치했습니다.
          - 큰 재화 수치를 만·억 단위로 표시하며 정확한 수치는 접근성 정보와 설명에 유지합니다.
          - 기존 NPC·그래픽·모션·전투·성장·파티 경험치·물약·같은 Wi-Fi 협동과 서명·앱 ID·저장 형식을 유지합니다. 집사 사절은 변경하지 않았습니다.

          JavaScript 13개·실제 TCP 4인 연결·Chromium 15개 시나리오, 8가지 화면/노치 조건의 글씨/그림 겹침·좌우 배치·독립 스크롤과 실제 퀘스트 보상 전환을 검사했습니다. 첨부 이미지는 검수용 캐릭터 자동 조작 화면입니다. 실제 휴대폰·장시간 성능 검증은 별도입니다.
          검증 빌드: https://github.com/ohohhyun/CatHome/actions/runs/42328011453
          APK SHA256: f4dd62e7e893d8cd7da6a92a5479db55456392b2d4ff94e972b21ec0e4e8b1e8
          EOF
      - name: Publish direct install, share ZIP and UI comparisons
        run: |
          if gh release view dungeon-crush-v2.9.6 >/dev/null 2>&1; then
            gh release download dungeon-crush-v2.9.6 --pattern DungeonCrush-2.9.6.apk --dir existing
            cmp apk/DungeonCrush-2.9.6.apk existing/DungeonCrush-2.9.6.apk
            gh release upload dungeon-crush-v2.9.6 DungeonCrush-2.9.6-Share.zip ui/*.png --clobber
          else
            gh release create dungeon-crush-v2.9.6 apk/DungeonCrush-2.9.6.apk DungeonCrush-2.9.6-Share.zip ui/*.png --target "$GITHUB_SHA" --title '던전크러시! 2.9.6 — 좌측 설명·우측 목록과 퀘스트 개선' --notes-file release-notes.md --prerelease
          fi
      - name: Verify every public download against checked files
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/dungeon-crush-v2.9.6" > release-assets.json
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          release=json.loads(Path('release-assets.json').read_text());assets={a['name']:a for a in release['assets']};images=list(Path('ui').glob('*.png'));assert len(images)==6
          for p in [Path('apk/DungeonCrush-2.9.6.apk'),Path('DungeonCrush-2.9.6-Share.zip'),*images]:
              a=assets[p.name];assert a['size']==p.stat().st_size and a['digest']=='sha256:'+sha256(p.read_bytes()).hexdigest(),p.name
          print('Verified published original APK, mandatory share ZIP and all reviewed UI images.')
          PY
