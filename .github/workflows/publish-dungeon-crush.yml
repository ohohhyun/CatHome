name: Publish Dungeon Crush direct APK
on:
  workflow_dispatch:
  push:
    branches: [codex/ashen-rift-apk]
    paths: ['.github/workflows/publish-dungeon-crush.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: dungeon-crush-v2.10.1-motion-audit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 82b0fe80686c3108d9607d9a6d674c4ac68e67d8
      - name: Verify completed build and download its unchanged signed APK
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/42460800665 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/42460800665 --jq .head_sha)" = ba7434c06747cb3d90dcf617dc8b9c927bcd2613
      - uses: actions/download-artifact@v4
        with:
          name: DungeonCrush-APK
          run-id: 42460800665
          github-token: ${{ github.token }}
          path: apk
      - name: Verify exact APK and create ALZip compatible share ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile,ZipInfo,ZIP_STORED
          p=Path('apk/DungeonCrush-2.10.1.apk');data=p.read_bytes()
          expected='222ea3c54e8b1a6fa3f917d9da97d81c4fd88f00b21b35b4396ecae324f2c605'
          assert len(data)==237657135 and sha256(data).hexdigest()==expected
          with ZipFile(p) as z:
              assert z.testzip() is None
              for name in ['actors.js','app.js']:
                  assert z.read('assets/'+name)==Path('dungeon-crush/app/src/main/assets/'+name).read_bytes()
          notes='던전크러시! 6직업 모션 수정판 (설치 버전 33)\r\n\r\n1. 압축을 풀고 DungeonCrush-2.10.1.apk를 설치하세요.\r\n2. 캐릭터 기록을 유지하려면 기존 앱을 삭제하지 말고 업데이트 설치하세요.\r\n3. 집사 사절과 별도로 설치되는 던전크러시 앱입니다.\r\n\r\nAPK SHA256: '+expected+'\r\n'
          output=Path('DungeonCrush-MotionFix-33.zip')
          with ZipFile(output,'w',compression=ZIP_STORED) as z:
              for name,content in [(p.name,data),('INSTALL-KO.txt',b'\xef\xbb\xbf'+notes.encode()),('HANDOFF.md',Path('dungeon-crush/HANDOFF.md').read_bytes())]:
                  item=ZipInfo(name,date_time=(2026,11,8,0,0,0));item.create_system=3;item.external_attr=0o100644<<16;item.compress_type=ZIP_STORED;z.writestr(item,content)
          with ZipFile(output) as z:
              assert z.testzip() is None and sha256(z.read(p.name)).hexdigest()==expected
          print('Verified exact signed APK and share ZIP:',output.stat().st_size,sha256(output.read_bytes()).hexdigest())
          PY
      - name: Publish persistent direct download
        run: |
          cat > release-notes.md <<'EOF'
          던전크러시! 6직업 전체 모션 수정판 (versionCode 33).
          
          아래 DungeonCrush-MotionFix-33.zip을 받고 압축을 푼 뒤 APK를 설치하세요. 기존 앱을 삭제하지 말고 업데이트 설치하세요.
          
          - 6직업의 상하체 잘림, 세라의 걷기 체형과 허벅지 비율을 수정했습니다.
          - 공격 3연타를 사전 로딩하고 모션 되감김을 제거했으며 프레임 사이를 부드럽게 전환합니다.
          - 기존 35개 자동 검사, 전체 744개 포즈, 6직업 실제 3연타와 스킬, APK 기존 서명 검증을 통과했습니다.
          - 집사 사절 원본은 수정하지 않았습니다.
          
          검증 빌드: https://github.com/ohohhyun/CatHome/actions/runs/42460800665
          APK SHA256: 222ea3c54e8b1a6fa3f917d9da97d81c4fd88f00b21b35b4396ecae324f2c605
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" DungeonCrush-MotionFix-33.zip --clobber
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" DungeonCrush-MotionFix-33.zip --target ba7434c06747cb3d90dcf617dc8b9c927bcd2613 --title '던전크러시! 6직업 전체 모션 수정판' --notes-file release-notes.md --prerelease --latest=false
          fi
      - name: Verify public ZIP size and SHA256
        run: |
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release-assets.json
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          p=Path('DungeonCrush-MotionFix-33.zip');r=json.loads(Path('release-assets.json').read_text())
          assert not r['draft']
          a=next(a for a in r['assets'] if a['name']==p.name)
          assert a['size']==p.stat().st_size and a['digest']=='sha256:'+sha256(p.read_bytes()).hexdigest()
          print('Verified public download:',a['browser_download_url'])
          PY
