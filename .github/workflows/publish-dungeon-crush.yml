name: Publish Dungeon Crush direct APK
on:
  workflow_dispatch:
  push:
    branches: [codex/ashen-rift-apk]
    paths: ['.github/workflows/publish-dungeon-crush.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: dungeon-crush-v2.13.0-rc1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7b3813ff519ec52effd1c201daae939835be333c
      - name: Verify completed precision checks and build
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/43162834939 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/43162834939 --jq .head_sha)" = 7b3813ff519ec52effd1c201daae939835be333c
          test "$(gh api repos/$GH_REPO/git/ref/tags/$RELEASE_TAG --jq .object.sha)" = 7b3813ff519ec52effd1c201daae939835be333c
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - uses: actions/download-artifact@v4
        with:
          name: DungeonCrush-APK
          run-id: 43162834939
          github-token: ${{ github.token }}
          path: apk
      - name: Verify exact signed APK and package compatible ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile,ZipInfo,ZIP_STORED
          import json,re
          root=Path('dungeon-crush');p=Path('apk/DungeonCrush-2.13.0.apk');data=p.read_bytes();expected='3576db3cb9ebfe12c080a5042b51e24732152e4326f09bd80e56f6e0c6578721'
          assert len(data)==311026186 and sha256(data).hexdigest()==expected
          with ZipFile(p) as z:
              assert z.testzip() is None
              for name in ['actors.js','app.js','rpg.js','town.js','progress.js','release.js','client.js','index.html','effects.js','sound.js','sprite-art.js','client.css','rankings.js','ranking-ui.js','refinement.css','ranking-config.js','ranking-client.js','navigation.js','engine.js','encounters.js','backgrounds.js','enemy-fx.js']:
                  assert z.read('assets/'+name)==(root/'app/src/main/assets'/name).read_bytes(),name
              for a in json.loads((root/'generated-art-sources.json').read_text())['assets']:
                  if a.get('packaged',True):assert sha256(z.read('assets/'+a['file'])).hexdigest()==a['sha256'],a['file']
              for a in json.loads((root/'combat-audio-sources.json').read_text())['assets']:
                  assert sha256(z.read('assets/audio/'+a['file'])).hexdigest()==a['sha256'],a['file']
              config=json.loads(re.search(r'Object.freeze\((.*)\)',z.read('assets/ranking-config.js').decode()).group(1))
              assert config==dict(enabled=False,endpoint='',publicKey='')
          notes='던전크러시! 2.13.0 출시 후보 (설치 버전 39)\r\n\r\n1. 압축을 풀고 DungeonCrush-2.13.0.apk를 설치하세요.\r\n2. 기존 앱을 삭제하지 말고 업데이트 설치하세요. 설정에서 성장 기록을 파일로 백업할 수 있습니다.\r\n3. 16챕터·48던전, 100레벨 정예 레이드 4개, 새 몬스터 20종, 실제 전투 배경 24장을 포함합니다.\r\n4. 새 의뢰는 기존 36개 완료 다음부터 이어갑니다. 최대 레벨은 100을 유지합니다.\r\n5. 같은 Wi-Fi의 파티원 모두 이번 버전으로 업데이트하세요. 프로토콜은 9입니다.\r\n6. 기합 기본 음량 25%, 판매 보호·되돌리기·백업 기능을 유지합니다. 랭킹 서버는 연결 전 상태입니다.\r\n7. 집사 사절과 별도 앱이며 원본을 수정하지 않았습니다.\r\n8. 기존 설치와 같은 테스트 서명입니다. 실기기 FPS/발열·조작감과 스토어 운영 서명·등록은 별도입니다.\r\n\r\nAPK SHA256: '+expected+'\r\n'
          summary='## 최신 검증 버전: 2.13.0 RC1\n\n- 검증 소스 `7b3813ff519ec52effd1c201daae939835be333c`.\n- 전체 47개 검사 후 APK/AAB 빌드, Android lint 및 서명·리소스 검증 성공: https://github.com/ohohhyun/CatHome/actions/runs/43162834939\n- 공개 다운로드: https://github.com/ohohhyun/CatHome/releases/tag/dungeon-crush-v2.13.0-rc1\n- versionCode 39 / Wi-Fi 프로토콜 9 / 저장 형식 2.\n- APK SHA256 `'+expected+'`.\n- 변경 내용은 release/FRONTIER-NOTES.md. 집사 사절 원본과 서버/DB는 변경하지 않았습니다.\n\n'
          handoff=(root/'HANDOFF.md').read_text();handoff=re.sub(r'## 진행 중: 2\.13\.0 지역 확장.*?(?=## 최신 검증 버전: 2\.12)',lambda _:summary,handoff,flags=re.S).replace('## 최신 검증 버전: 2.12.0 RC1','## 이전 검증 버전: 2.12.0 RC1')
          output=Path('DungeonCrush-2.13.0-RC1.zip');docs=['RELEASE-CHECKLIST.md','PRIVACY-KO.md','STORE-LISTING-KO.md','RANKING-INTEGRATION.md','UI-REFERENCES.md','AUDIO-NOTES.md','FRONTIER-NOTES.md']
          with ZipFile(output,'w',compression=ZIP_STORED) as z:
              for name,content in [(p.name,data),('INSTALL-KO.txt',b'\xef\xbb\xbf'+notes.encode()),('HANDOFF.md',handoff.encode())]+[(name,(root/'release'/name).read_bytes()) for name in docs]:
                  if name=='RELEASE-CHECKLIST.md':content=content.decode().replace('최종 자동 검증·APK·공개 ZIP 결과는 완료 후 이 문서에 기록합니다.', '전체 47개 검사 후 APK/AAB 빌드·Android lint·서명/리소스 확인 성공: https://github.com/ohohhyun/CatHome/actions/runs/43162834939 · APK SHA256 '+expected).encode()
                  item=ZipInfo(name,date_time=(2026,11,12,0,0,0));item.create_system=3;item.external_attr=0o100644<<16;item.compress_type=ZIP_STORED;z.writestr(item,content)
          with ZipFile(output) as z:
              assert z.testzip() is None and sha256(z.read(p.name)).hexdigest()==expected
          print('ZIP:',output.stat().st_size,sha256(output.read_bytes()).hexdigest())
          PY
      - name: Publish verified persistent download
        run: |
          cat > release-notes.md <<'NOTES'
          던전크러시! 2.13.0 출시 후보 (versionCode 39).

          아래 Assets에서 **DungeonCrush-2.13.0-RC1.zip**을 받아 압축을 풀고 APK를 설치하세요. 기존 앱을 삭제하지 말고 업데이트 설치하세요.

          - 스토리 **16챕터·48던전**으로 확장했습니다. 수로·독늪·태엽 공방·천상궁에 새 던전 12개와 보스 12종, 일반 몬스터 8종을 추가했습니다.
          - **100레벨 정예 레이드 4개**는 해당 지역 의뢰 완료 후 열립니다. 지역 보스 3종의 5연전, 100레벨 장비와 반복 정복 핵 3개를 제공합니다.
          - 실제 전투 배경을 5장에서 **24장**으로 늘렸습니다. 초기 공유 지역과 새 던전에 원화 19장을 추가하고 필요한 배경만 준비합니다.
          - 적 공격을 **16개 지역별 효과**로 구분했습니다. 직선·여러 갈래 광선·십자·고리·시차 장판·독침 부채탄과 실제 판정에 맞는 위험 표시를 추가했습니다.
          - 기존 저장과 최대 100레벨, 6직업 모션, 작은 기합(기본 25%), 보스 음악, 착용/잠금 판매 보호, 판매 되돌리기와 백업을 유지합니다. 랭킹 서버는 연결 전 상태입니다.
          - **47개 자동 검사 후** APK/AAB를 빌드했고 Android lint, 기존 설치 서명과 최종 원화·음원·스크립트 검증을 통과했습니다. 실제 2.12 저장 호환, 48개 화면/24개 배경, 새 320포즈, 위험 판정, 로딩 실패/재시도, 작은 화면과 4인 통신도 검사했습니다.

          Wi-Fi 파티원 모두 이번 버전으로 업데이트하세요(프로토콜 9). 집사 사절 원본은 수정하지 않았습니다. 실제 단말의 FPS/발열/조작감, 운영 서명과 스토어 등록은 별도입니다.

          검증 빌드: https://github.com/ohohhyun/CatHome/actions/runs/43162834939
          APK SHA256: 3576db3cb9ebfe12c080a5042b51e24732152e4326f09bd80e56f6e0c6578721
          NOTES
          gh release upload "$RELEASE_TAG" DungeonCrush-2.13.0-RC1.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --notes-file release-notes.md
      - name: Verify public ZIP size and digest
        run: |
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release-assets.json
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          p=Path('DungeonCrush-2.13.0-RC1.zip');r=json.loads(Path('release-assets.json').read_text());assert not r['draft']
          a=next(a for a in r['assets'] if a['name']==p.name)
          assert a['size']==p.stat().st_size and a['digest']=='sha256:'+sha256(p.read_bytes()).hexdigest()
          print('Verified public ZIP:',a['browser_download_url'])
          PY
