name: Publish Dungeon Crush direct APK
on:
  workflow_dispatch:
  push:
    branches: [codex/ashen-rift-apk]
    paths: ['.github/workflows/publish-dungeon-crush.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified 2.9.4 APK and reviewed UI screens
        run: |
          gh run download 42292102026 --name DungeonCrush-APK --dir apk
          gh run download 42292102026 --name DungeonCrush-Inventory-Previews --dir previews
      - name: Verify unchanged signed APK bytes and full offline Korean font
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          p=Path('apk/DungeonCrush-2.9.4.apk');data=p.read_bytes()
          assert len(data)==98660024 and sha256(data).hexdigest()=='ec0276be6f1cb86ca3e0eadf9524a46f92ddcb2fbf3c43f6af8499269d69b556'
          with ZipFile(p) as z:
              assert z.testzip() is None and 'AndroidManifest.xml' in z.namelist()
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion29/') and n.endswith('.webp')])==85
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion292/') and n.endswith('.webp')])==4
              assert len([n for n in z.namelist() if n.startswith('assets/art/advanced/') and n.endswith('.webp')])==5
              assert sha256(z.read('assets/art/rift-ui.otf')).hexdigest()=='a5444ac84938025003b520d937476b2df2889d458c12a5abc9981d03e5510018'
              assert 'assets/ui-layout.js' in z.namelist() and 'assets/art/FONT-LICENSE.txt' in z.namelist()
          print('Verified original signed APK and complete offline Korean font; no rebuild/repackaging.')
          PY
      - name: Package verified APK as a shareable ZIP
        run: |
          python3 - apk/DungeonCrush-2.9.4.apk DungeonCrush-2.9.4-Share.zip <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZipInfo,ZIP_STORED
          from hashlib import sha256
          import sys
          apk=Path(sys.argv[1]);output=Path(sys.argv[2]);data=apk.read_bytes();expected='ec0276be6f1cb86ca3e0eadf9524a46f92ddcb2fbf3c43f6af8499269d69b556'
          assert len(data)==98660024 and sha256(data).hexdigest()==expected
          notes='던전크러시! 2.9.4 설치 및 공유 안내\r\n\r\n1. ZIP 압축을 풉니다.\r\n2. DungeonCrush-2.9.4.apk 파일을 눌러 기존 던전크러시에 업데이트 설치합니다.\r\n3. 기존 캐릭터 기록을 유지하려면 앱을 삭제하지 마세요.\r\n4. 친구도 같은 2.9.4 버전을 설치하세요.\r\n5. 같은 Wi-Fi에 연결하고 한 명이 방을 만든 뒤 친구는 방장 IP와 4자리 코드로 참가합니다.\r\n\r\n집사 사절과 별도로 설치되는 던전크러시 앱입니다.\r\nAPK SHA256: '+expected+'\r\n'
          with ZipFile(output,'w',compression=ZIP_STORED) as z:
              for name,content in [(apk.name,data),('INSTALL-KO.txt',b'\xef\xbb\xbf'+notes.encode('utf-8'))]:
                  item=ZipInfo(name,date_time=(2026,11,7,0,0,0));item.create_system=3;item.external_attr=0o100644<<16;item.compress_type=ZIP_STORED;z.writestr(item,content)
          with ZipFile(output) as z:
              assert z.testzip() is None and z.namelist()==[apk.name,'INSTALL-KO.txt']
              assert sha256(z.read(apk.name)).hexdigest()==expected
          print('Verified share ZIP:',output.name,output.stat().st_size,sha256(output.read_bytes()).hexdigest())
          PY
      - name: Prepare reviewed inventory and HUD images
        run: |
          mkdir ui
          cp previews/inventory-ui-1024-bag.png ui/DungeonCrush-2.9.4-Inventory.png
          cp previews/inventory-ui-equipped-filter.png ui/DungeonCrush-2.9.4-Equipped.png
          cp previews/inventory-ui-ring-enhancement.png ui/DungeonCrush-2.9.4-Enhancement.png
          cp previews/inventory-ui-640-hud.png ui/DungeonCrush-2.9.4-PartyHUD.png
      - name: Prepare install notes
        run: |
          cat > release-notes.md <<'EOF'
          던전크러시! 2.9.4 인벤토리·필터·글씨 수정 APK와 공유용 ZIP입니다.

          바로 설치: DungeonCrush-2.9.4.apk를 누르세요.
          친구에게 공유: DungeonCrush-2.9.4-Share.zip을 보내고, 압축을 푼 뒤 안의 APK를 설치하세요.
          기존과 같은 서명·앱 ID·저장 형식입니다. 기존 앱에 업데이트 설치하면 캐릭터 기록이 유지됩니다.

          - 착용 장비를 왼쪽 전용 목록에 배치했습니다. 가방에서도 체크 표시와 '착용 중' 배지, 별도 카드 배경/테두리로 구분합니다.
          - 그림·상태·이름을 독립된 줄로 분리했습니다. 강화는 '반지 +3'처럼 장비 이름에 표시하며 착용 배지에는 붙이지 않습니다.
          - 부위·등급·착용/미착용 필터, 등급/레벨/강화/획득 기준 정렬과 오름차순/내림차순을 추가했습니다. 보기 순서는 저장된 장비 순서나 착용 상태를 바꾸지 않습니다.
          - 패널과 긴 닉네임/HP/파티 이름을 줄바꿈하고 스크롤로 확인할 수 있게 했습니다. 마을 버전 문구의 겹침, 탭 전환 후 화면 중간에서 시작하던 문제도 수정했습니다.
          - 오프라인 글꼴에 한글 11,172자와 UI 기호를 포함해 등급·정렬 등의 글자가 빠지는 문제를 수정했습니다. 캐릭터 위 파티 이름은 서로와 HUD를 피해 표시합니다.
          - 기존 그래픽·2.9.3 동작 크기·발 동작·전투·성장·장비·파티 경험치·물약·같은 Wi-Fi 협동을 유지합니다.

          주요 메뉴·전투·파티·정산 화면을 8개 크기/노치 조건과 긴 숫자·닉네임으로 검사했습니다. 첨부 이미지는 검수용 캐릭터 화면이며, 실제 휴대폰 검증은 별도입니다. 집사 사절은 변경하지 않았습니다.
          검증 빌드: https://github.com/ohohhyun/CatHome/actions/runs/42292102026
          APK SHA256: ec0276be6f1cb86ca3e0eadf9524a46f92ddcb2fbf3c43f6af8499269d69b556
          EOF
      - name: Publish direct install, share ZIP and UI comparisons
        run: |
          if gh release view dungeon-crush-v2.9.4 >/dev/null 2>&1; then
            gh release download dungeon-crush-v2.9.4 --pattern DungeonCrush-2.9.4.apk --dir existing
            cmp apk/DungeonCrush-2.9.4.apk existing/DungeonCrush-2.9.4.apk
            gh release upload dungeon-crush-v2.9.4 DungeonCrush-2.9.4-Share.zip ui/*.png --clobber
          else
            gh release create dungeon-crush-v2.9.4 apk/DungeonCrush-2.9.4.apk DungeonCrush-2.9.4-Share.zip ui/*.png --target "$GITHUB_SHA" --title '던전크러시! 2.9.4 — 착용 장비·필터·글씨 수정' --notes-file release-notes.md --prerelease
          fi
      - name: Verify every public download against checked files
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/dungeon-crush-v2.9.4" > release-assets.json
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          release=json.loads(Path('release-assets.json').read_text());assets={a['name']:a for a in release['assets']};images=list(Path('ui').glob('*.png'));assert len(images)==4
          for p in [Path('apk/DungeonCrush-2.9.4.apk'),Path('DungeonCrush-2.9.4-Share.zip'),*images]:
              a=assets[p.name];assert a['size']==p.stat().st_size and a['digest']=='sha256:'+sha256(p.read_bytes()).hexdigest(),p.name
          print('Verified published original APK, mandatory share ZIP and all reviewed UI images.')
          PY
