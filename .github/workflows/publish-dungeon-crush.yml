name: Publish Dungeon Crush direct APK
on:
  workflow_dispatch:
  push:
    branches: [codex/ashen-rift-apk]
    paths: ['.github/workflows/publish-dungeon-crush.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: dungeon-crush-v2.15.2-rc1
      DUNGEON_RELEASE_SOURCE: 44fddcf235bd1144ad933e1650290d847ae4fa17
      DUNGEON_RELEASE_RUN: '43392615202'
      DUNGEON_RELEASE_ID: '444017344'
      DUNGEON_APK_BYTES: '482246354'
      DUNGEON_APK_SHA256: 33803a1f8dc4d4abd569079d409d084cac0079f294a5140b725850f9ee08d95e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 44fddcf235bd1144ad933e1650290d847ae4fa17
      - name: Require the exact successful build and fixed draft release
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/$DUNGEON_RELEASE_RUN --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/$DUNGEON_RELEASE_RUN --jq .head_sha)" = "$DUNGEON_RELEASE_SOURCE"
          test "$(gh api repos/$GH_REPO/git/ref/tags/$RELEASE_TAG --jq .object.sha)" = "$DUNGEON_RELEASE_SOURCE"
          test "$(gh api repos/$GH_REPO/releases/$DUNGEON_RELEASE_ID --jq .tag_name)" = "$RELEASE_TAG"
          test "$(gh api repos/$GH_REPO/releases/$DUNGEON_RELEASE_ID --jq .draft)" = true
      - uses: actions/download-artifact@v4
        with:
          name: DungeonCrush-APK
          run-id: 43392615202
          github-token: ${{ github.token }}
          path: apk
      - name: Verify and package exact signed APK
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['DUNGEON_RELEASE_SOURCE']
          p=Path('apk/DungeonCrush-2.15.2.apk'); data=p.read_bytes()
          assert len(data)==int(os.environ['DUNGEON_APK_BYTES'])
          assert hashlib.sha256(data).hexdigest()==os.environ['DUNGEON_APK_SHA256']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              for f in Path('dungeon-crush/app/src/main/assets').iterdir():
                  if f.is_file() and f.suffix in ('.js','.css','.html'):assert z.read('assets/'+f.name)==f.read_bytes(),f.name
              assert 'VER 2.15.2' in z.read('assets/index.html').decode()
              ui=z.read('assets/premium-ui.js').decode()
              assert "['walk'," not in ui and '걷기' not in ui
          guide='던전크러시 2.15.2 (설치 버전 44)\r\n\r\n압축을 풀고 DungeonCrush-2.15.2.apk를 기존 앱 위에 업데이트 설치하세요. 기존 앱을 삭제하지 마세요.\r\n미리보기 걷기를 제거했습니다. 달리기→공격→점프→스킬 하나를 자동 재생합니다.\r\n저장 형식 2 / Wi-Fi 프로토콜 10 / 기존 서명을 유지합니다.\r\n검증 빌드: https://github.com/ohohhyun/CatHome/actions/runs/43392615202\r\nAPK SHA-256: '+os.environ['DUNGEON_APK_SHA256']+'\r\n'
          out=Path('DungeonCrush-2.15.2-RC1.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED) as z:
              z.writestr(p.name,data)
              z.writestr('INSTALL-KO.txt',b'\xef\xbb\xbf'+guide.encode())
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read(p.name)).hexdigest()==os.environ['DUNGEON_APK_SHA256']
          meta=dict(file=out.name,bytes=out.stat().st_size,sha256=hashlib.sha256(out.read_bytes()).hexdigest())
          Path('package-verification.json').write_text(json.dumps(meta,indent=2));print(meta)
          PY
      - name: Publish permanent anonymous download
        run: |
          gh release upload "$RELEASE_TAG" DungeonCrush-2.15.2-RC1.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
      - name: Verify anonymous full download and ZIP integrity
        run: |
          gh api "repos/$GH_REPO/releases/$DUNGEON_RELEASE_ID" > release-assets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('package-verification.json').read_text());r=json.loads(Path('release-assets.json').read_text());assert not r['draft']
          a=next(a for a in r['assets'] if a['name']==m['file']);assert a['size']==m['bytes'] and a['digest']=='sha256:'+m['sha256']
          Path('download-url.txt').write_text(a['browser_download_url'])
          PY
          curl --fail --location --retry 2 "$(cat download-url.txt)" -o public-download.zip
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          m=json.loads(Path('package-verification.json').read_text());p=Path('public-download.zip')
          assert p.stat().st_size==m['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read('DungeonCrush-2.15.2.apk')).hexdigest()==os.environ['DUNGEON_APK_SHA256']
          print('Verified anonymous download:',Path('download-url.txt').read_text())
          print(m)
          PY
