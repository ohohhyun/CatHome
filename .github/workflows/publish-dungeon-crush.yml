name: Publish Dungeon Crush direct APK
on:
  workflow_dispatch:
  push:
    branches: [codex/ashen-rift-apk]
    paths: ['.github/workflows/publish-dungeon-crush.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Preserve the completed fresh-chat handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          Path('HANDOFF.md').write_bytes(base64.b64decode(''))
          PY
      - name: Download the exact verified 2.10.1 APK and reviewed screens
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/42441280165 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/42441280165 --jq .head_sha)" = 5501e808bc9a02f3b8b709a09891c348df6f7631
          gh run download 42441280165 --name DungeonCrush-APK --dir apk
          gh run download 42441280165 --name DungeonCrush-Previews --dir previews
      - name: Verify unchanged signed APK bytes and full offline Korean font
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          p=Path('apk/DungeonCrush-2.10.1.apk');data=p.read_bytes()
          assert len(data)==238992846 and sha256(data).hexdigest()=='a4e4bb85eeb904f25323a973cdbc516a7489cf9635e7f4f388af569c0cdddff7'
          with ZipFile(p) as z:
              assert z.testzip() is None and 'AndroidManifest.xml' in z.namelist()
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion29/') and n.endswith('.webp')])==85
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion299/') and n.endswith('.webp')])==48
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion292/') and n.endswith('.webp')])==0
              assert len([n for n in z.namelist() if n.startswith('assets/art/advanced/') and n.endswith('.webp')])==5
              assert sha256(z.read('assets/art/rift-ui.otf')).hexdigest()=='a5444ac84938025003b520d937476b2df2889d458c12a5abc9981d03e5510018'
              assert sha256(z.read('assets/art/town-npcs.webp')).hexdigest()=='da8c8a5cc65b7d0cd675a05b362760eaabd28cfa299fc3d2700e1cc4b76c48d2'
              assert 'assets/encounters.js' in z.namelist()
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion210/') and n.endswith('.webp')])==81
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion211/') and n.endswith('.webp')])==8
              assert all('assets/'+n in z.namelist() for n in ['arena.js','growth.js','dialogs.js','expansion.css'])
              assert 'assets/ui-layout.js' in z.namelist() and 'assets/art/FONT-LICENSE.txt' in z.namelist()
          print('Verified original signed APK and complete offline Korean font; no rebuild/repackaging.')
          PY
      - name: Package verified APK as a shareable ZIP
        run: |
          python3 - apk/DungeonCrush-2.10.1.apk DungeonCrush-2.10.1-Share.zip <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZipInfo,ZIP_STORED
          from hashlib import sha256
          import sys
          apk=Path(sys.argv[1]);output=Path(sys.argv[2]);data=apk.read_bytes();expected='a4e4bb85eeb904f25323a973cdbc516a7489cf9635e7f4f388af569c0cdddff7'
          assert len(data)==238992846 and sha256(data).hexdigest()==expected
          notes='던전크러시! 2.10.1 설치 및 공유 안내\r\n\r\n1. ZIP 압축을 풉니다.\r\n2. DungeonCrush-2.10.1.apk 파일을 눌러 기존 던전크러시에 업데이트 설치합니다.\r\n3. 기존 캐릭터 기록을 유지하려면 앱을 삭제하지 마세요.\r\n4. 친구도 같은 2.10.1 버전을 설치하세요.\r\n5. 같은 Wi-Fi에 연결하고 한 명이 방을 만든 뒤 친구는 방장 IP와 4자리 코드로 참가합니다.\r\n\r\n집사 사절과 별도로 설치되는 던전크러시 앱입니다.\r\nAPK SHA256: '+expected+'\r\n'
          with ZipFile(output,'w',compression=ZIP_STORED) as z:
              for name,content in [(apk.name,data),('INSTALL-KO.txt',b'\xef\xbb\xbf'+notes.encode('utf-8')),('HANDOFF.md',Path('HANDOFF.md').read_bytes())]:
                  item=ZipInfo(name,date_time=(2026,11,8,0,0,0));item.create_system=3;item.external_attr=0o100644<<16;item.compress_type=ZIP_STORED;z.writestr(item,content)
          with ZipFile(output) as z:
              assert z.testzip() is None and z.namelist()==[apk.name,'INSTALL-KO.txt','HANDOFF.md']
              assert sha256(z.read(apk.name)).hexdigest()==expected
          print('Verified share ZIP:',output.name,output.stat().st_size,sha256(output.read_bytes()).hexdigest())
          PY
      - name: Collect current regression screenshots
        run: |
          mkdir ui
          cp previews/hotfix-facing-0.png ui/DungeonCrush-2.10.1-Facing.png
          cp previews/hotfix-facing-18.png ui/DungeonCrush-2.10.1-Regional-Enemies.png
          cp previews/hotfix-run-0.png ui/DungeonCrush-2.10.1-Run.png
          cp previews/hotfix-skill-contrast-640.png ui/DungeonCrush-2.10.1-Skills.png
          cp previews/hotfix-bulk-left-640.png ui/DungeonCrush-2.10.1-Bulk-Left.png
          cp previews/expansion-static-cover.png ui/DungeonCrush-2.10.1-Cover.png
          cp previews/expansion-four-player-ffa-640.png ui/DungeonCrush-2.10.1-FFA.png
      - uses: actions/upload-artifact@v4
        with:
          name: DungeonCrush-2.10.1-Reviewed-UI
          path: ui/*.png
          if-no-files-found: error
      - name: Prepare install notes
        run: |
          cat > release-notes.md <<'EOF'
          던전크러시! 2.10.1 — 몬스터 방향·전투 속도·기본 공격·달리기 외형 수정.
          
          APK를 눌러 기존 던전크러시에 업데이트 설치하세요. 캐릭터 기록을 유지하려면 앱을 삭제하지 마세요.
          친구에게는 Share.zip 또는 이 릴리스 주소를 보내세요. 모두 2.10.1을 설치하고 같은 Wi-Fi에 연결하세요.
          
          - 좌우 원화가 섞인 몬스터 72종의 방향을 각각 보정했습니다.
          - 일반 적 이동 40%, 보스 25%를 올리고 접근·공격 간격을 조정했습니다. 공격 예고 시간은 유지합니다.
          - 기본 공격을 무기 아이콘으로 고정하고 빈 스킬 칸/남은 입력을 분리했습니다. 기존 장착을 보존하며 배치 복구 기능을 추가했습니다.
          - 흰 배경이 남던 보스·몬스터 4종을 투명 처리했습니다.
          - 금색 선택·비활성 버튼의 글자를 진하게 표시하고, 일괄 분해를 왼쪽 상단으로 옮겼습니다.
          - 달리기의 상체 색과 크기를 대기 자세와 통일하고 8포즈 다리 동작을 유지했습니다.
          - 6직업·100레벨·36던전·최대4인 개인전·6칸 장착·기존 기록과 설치 서명을 유지합니다.
          - 새 채팅에서 작업을 이어가려면 첨부 HANDOFF.md를 먼저 읽도록 요청하세요. ZIP에도 포함했습니다.
          
          검증: JavaScript16개·실제 TCP4인·Chrome18개 시나리오(총35개), 실제 터치 입력, 72종 방향, 달리기 상체 픽셀, 작은 화면 글자 대비, APK 서명·원화·글꼴 검사. 물리 휴대폰의 프레임률과 조작감은 별도 확인이 필요합니다.
          검증 소스: 5501e808bc9a02f3b8b709a09891c348df6f7631
          검증 빌드: https://github.com/ohohhyun/CatHome/actions/runs/42441280165
          APK SHA256: a4e4bb85eeb904f25323a973cdbc516a7489cf9635e7f4f388af569c0cdddff7
          EOF
      - name: Publish direct install, share ZIP and UI comparisons
        run: |
          if gh release view dungeon-crush-v2.10.1 >/dev/null 2>&1; then
            gh release download dungeon-crush-v2.10.1 --pattern DungeonCrush-2.10.1.apk --dir existing
            cmp apk/DungeonCrush-2.10.1.apk existing/DungeonCrush-2.10.1.apk
            gh release upload dungeon-crush-v2.10.1 DungeonCrush-2.10.1-Share.zip HANDOFF.md ui/*.png --clobber
          else
            gh release create dungeon-crush-v2.10.1 apk/DungeonCrush-2.10.1.apk DungeonCrush-2.10.1-Share.zip HANDOFF.md ui/*.png --target "$GITHUB_SHA" --title '던전크러시! 2.10.1 — 방향·기본 공격·달리기 수정' --notes-file release-notes.md --prerelease
          fi
      - name: Verify every public download against checked files
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/dungeon-crush-v2.10.1" > release-assets.json
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          release=json.loads(Path('release-assets.json').read_text());assets={a['name']:a for a in release['assets']};images=list(Path('ui').glob('*.png'));assert len(images)==7
          for p in [Path('apk/DungeonCrush-2.10.1.apk'),Path('DungeonCrush-2.10.1-Share.zip'),Path('HANDOFF.md'),*images]:
              a=assets[p.name];assert a['size']==p.stat().st_size and a['digest']=='sha256:'+sha256(p.read_bytes()).hexdigest(),p.name
          print('Verified published original APK, mandatory share ZIP and all reviewed UI images.')
          PY
