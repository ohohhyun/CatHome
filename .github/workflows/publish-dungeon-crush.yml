name: Publish Dungeon Crush direct APK
on:
  workflow_dispatch:
  push:
    branches: [codex/ashen-rift-apk]
    paths: ['.github/workflows/publish-dungeon-crush.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the exact verified 2.10.0 APK and reviewed screens
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/42426416837 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/42426416837 --jq .head_sha)" = d67541aa5e7eb1308d6e0076a12a1c3be4d1fb97
          gh run download 42426416837 --name DungeonCrush-APK --dir apk
          gh run download 42426416837 --name DungeonCrush-Previews --dir previews
      - name: Verify unchanged signed APK bytes and full offline Korean font
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          p=Path('apk/DungeonCrush-2.10.0.apk');data=p.read_bytes()
          assert len(data)==238656266 and sha256(data).hexdigest()=='e8b2331339132ef7d0fb62b8e5f08125981a922a8f764167aced5c2bb19d1a15'
          with ZipFile(p) as z:
              assert z.testzip() is None and 'AndroidManifest.xml' in z.namelist()
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion29/') and n.endswith('.webp')])==85
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion299/') and n.endswith('.webp')])==48
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion292/') and n.endswith('.webp')])==4
              assert len([n for n in z.namelist() if n.startswith('assets/art/advanced/') and n.endswith('.webp')])==5
              assert sha256(z.read('assets/art/rift-ui.otf')).hexdigest()=='a5444ac84938025003b520d937476b2df2889d458c12a5abc9981d03e5510018'
              assert sha256(z.read('assets/art/town-npcs.webp')).hexdigest()=='da8c8a5cc65b7d0cd675a05b362760eaabd28cfa299fc3d2700e1cc4b76c48d2'
              assert 'assets/encounters.js' in z.namelist()
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion210/') and n.endswith('.webp')])==85
              assert all('assets/'+n in z.namelist() for n in ['arena.js','growth.js','dialogs.js','expansion.css'])
              assert 'assets/ui-layout.js' in z.namelist() and 'assets/art/FONT-LICENSE.txt' in z.namelist()
          print('Verified original signed APK and complete offline Korean font; no rebuild/repackaging.')
          PY
      - name: Package verified APK as a shareable ZIP
        run: |
          python3 - apk/DungeonCrush-2.10.0.apk DungeonCrush-2.10.0-Share.zip <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZipInfo,ZIP_STORED
          from hashlib import sha256
          import sys
          apk=Path(sys.argv[1]);output=Path(sys.argv[2]);data=apk.read_bytes();expected='e8b2331339132ef7d0fb62b8e5f08125981a922a8f764167aced5c2bb19d1a15'
          assert len(data)==238656266 and sha256(data).hexdigest()==expected
          notes='던전크러시! 2.10.0 설치 및 공유 안내\r\n\r\n1. ZIP 압축을 풉니다.\r\n2. DungeonCrush-2.10.0.apk 파일을 눌러 기존 던전크러시에 업데이트 설치합니다.\r\n3. 기존 캐릭터 기록을 유지하려면 앱을 삭제하지 마세요.\r\n4. 친구도 같은 2.10.0 버전을 설치하세요.\r\n5. 같은 Wi-Fi에 연결하고 한 명이 방을 만든 뒤 친구는 방장 IP와 4자리 코드로 참가합니다.\r\n\r\n집사 사절과 별도로 설치되는 던전크러시 앱입니다.\r\nAPK SHA256: '+expected+'\r\n'
          with ZipFile(output,'w',compression=ZIP_STORED) as z:
              for name,content in [(apk.name,data),('INSTALL-KO.txt',b'\xef\xbb\xbf'+notes.encode('utf-8'))]:
                  item=ZipInfo(name,date_time=(2026,11,8,0,0,0));item.create_system=3;item.external_attr=0o100644<<16;item.compress_type=ZIP_STORED;z.writestr(item,content)
          with ZipFile(output) as z:
              assert z.testzip() is None and z.namelist()==[apk.name,'INSTALL-KO.txt']
              assert sha256(z.read(apk.name)).hexdigest()==expected
          print('Verified share ZIP:',output.name,output.stat().st_size,sha256(output.read_bytes()).hexdigest())
          PY
      - name: Prepare reviewed cover, priest, skill slots, free-for-all and confirmations
        run: |
          mkdir ui
          cp previews/expansion-static-cover.png ui/DungeonCrush-2.10.0-Cover.png
          cp previews/expansion-priest-selection.png ui/DungeonCrush-2.10.0-Priest.png
          cp previews/expansion-four-player-ffa-640.png ui/DungeonCrush-2.10.0-FFA.png
          cp previews/expansion-skill-slots-640.png ui/DungeonCrush-2.10.0-Slots.png
          cp previews/expansion-anchored-sale-640.png ui/DungeonCrush-2.10.0-Confirm.png
          cp previews/expansion-priest-growth-ultimate.png ui/DungeonCrush-2.10.0-Ultimate.png
          cp previews/menu-split-640-inventory.png ui/DungeonCrush-2.10.0-Compact.png
      - name: Prepare install notes
        run: |
          cat > release-notes.md <<'EOF'
          던전크러시! 2.10.0 — 프리스트·100레벨·36던전·최대 4인 개인전 패치입니다.
          
          APK를 눌러 기존 던전크러시에 업데이트 설치하세요. 성장 기록을 유지하려면 앱을 삭제하지 마세요.
          친구에게는 Share.zip 또는 이 릴리스 주소를 보내세요. 모두 2.10.0을 설치하고 같은 Wi-Fi에 연결해야 합니다.
          
          - 신규 여섯 번째 캐릭터 프리스트 엘리안: 망치·성광 공격, 치유와 보호, 고유 장비 그림과 모션을 추가했습니다.
          - 원거리 캐릭터의 기본 공격 속도와 넉백·경직을 낮춰 몬스터가 접근할 수 있도록 조정했습니다.
          - 30레벨부터 최대 4인 개인전: 2~4명, 팀 없음, 장비·능력치와 기본 스킬 보정, 물약 불가, 3라운드 중 2라운드 선승입니다. 방장 연결 종료 시 대전은 취소됩니다.
          - 최대 레벨 100, 12챕터·36던전과 던전별 일반 몬스터·보스 외형을 적용했습니다. 100레벨 이후 신규 전직은 포함하지 않습니다.
          - 각 직업에 60·80·100레벨 습득 스킬 3종씩 총 18종을 추가했습니다. 전용 그림·아이콘과 커진 이펙트를 적용했습니다.
          - 가로 6칸 스킬 장착·해제·교체와 빈칸 저장을 지원합니다. 던전용과 개인전용 배치를 따로 저장합니다.
          - 구매·판매·분해·강화·제작 확인, 장비 비교와 스킬 장착 선택창을 누른 버튼/아이템 앞에 표시하고 원래 버튼을 강조합니다.
          - 정지된 새 메인 원화를 누르면 메뉴가 표시되며, 캐릭터 선택에서도 움직임을 멈췄습니다.
          - 착용 장비 우선 정렬, 기존 5개 캐릭터 기록, 기존 설치 패키지/서명을 유지합니다. 집사 사절 원본은 변경하지 않았습니다.
          
          검증: JavaScript 15개, 실제 TCP 4인 연결, Chrome 17개 시나리오, 작은 화면·확대 글씨·가로 6칸·실제 네 브라우저 개인전·APK 서명·포함 원화/전체 한글 글꼴 검사. 물리 휴대폰의 프레임률·터치 감각은 별도 확인이 필요합니다.
          검증 빌드: https://github.com/ohohhyun/CatHome/actions/runs/42426416837
          APK SHA256: e8b2331339132ef7d0fb62b8e5f08125981a922a8f764167aced5c2bb19d1a15
          EOF
      - name: Publish direct install, share ZIP and UI comparisons
        run: |
          if gh release view dungeon-crush-v2.10.0 >/dev/null 2>&1; then
            gh release download dungeon-crush-v2.10.0 --pattern DungeonCrush-2.10.0.apk --dir existing
            cmp apk/DungeonCrush-2.10.0.apk existing/DungeonCrush-2.10.0.apk
            gh release upload dungeon-crush-v2.10.0 DungeonCrush-2.10.0-Share.zip ui/*.png --clobber
          else
            gh release create dungeon-crush-v2.10.0 apk/DungeonCrush-2.10.0.apk DungeonCrush-2.10.0-Share.zip ui/*.png --target "$GITHUB_SHA" --title '던전크러시! 2.10.0 — 6직업·100레벨·4인 개인전' --notes-file release-notes.md --prerelease
          fi
      - name: Verify every public download against checked files
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/dungeon-crush-v2.10.0" > release-assets.json
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          release=json.loads(Path('release-assets.json').read_text());assets={a['name']:a for a in release['assets']};images=list(Path('ui').glob('*.png'));assert len(images)==7
          for p in [Path('apk/DungeonCrush-2.10.0.apk'),Path('DungeonCrush-2.10.0-Share.zip'),*images]:
              a=assets[p.name];assert a['size']==p.stat().st_size and a['digest']=='sha256:'+sha256(p.read_bytes()).hexdigest(),p.name
          print('Verified published original APK, mandatory share ZIP and all reviewed UI images.')
          PY
