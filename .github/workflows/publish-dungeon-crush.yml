name: Publish Dungeon Crush direct APK
on:
  workflow_dispatch:
  push:
    branches: [codex/ashen-rift-apk]
    paths: ['.github/workflows/publish-dungeon-crush.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified 2.9.7 APK and reviewed UI screens
        run: |
          gh run download 42330052474 --name DungeonCrush-APK --dir apk
          gh run download 42330052474 --name DungeonCrush-Menu-Previews --dir previews
      - name: Verify unchanged signed APK bytes and full offline Korean font
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          p=Path('apk/DungeonCrush-2.9.7.apk');data=p.read_bytes()
          assert len(data)==99183156 and sha256(data).hexdigest()=='9c3c75249a96b4d5e00f2de516b72c132300f4b5941e8950ea11a86ee33097d4'
          with ZipFile(p) as z:
              assert z.testzip() is None and 'AndroidManifest.xml' in z.namelist()
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion29/') and n.endswith('.webp')])==85
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion292/') and n.endswith('.webp')])==4
              assert len([n for n in z.namelist() if n.startswith('assets/art/advanced/') and n.endswith('.webp')])==5
              assert sha256(z.read('assets/art/rift-ui.otf')).hexdigest()=='a5444ac84938025003b520d937476b2df2889d458c12a5abc9981d03e5510018'
              assert sha256(z.read('assets/art/town-npcs.webp')).hexdigest()=='da8c8a5cc65b7d0cd675a05b362760eaabd28cfa299fc3d2700e1cc4b76c48d2'
              assert 'assets/ui-layout.js' in z.namelist() and 'assets/art/FONT-LICENSE.txt' in z.namelist()
          print('Verified original signed APK and complete offline Korean font; no rebuild/repackaging.')
          PY
      - name: Package verified APK as a shareable ZIP
        run: |
          python3 - apk/DungeonCrush-2.9.7.apk DungeonCrush-2.9.7-Share.zip <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZipInfo,ZIP_STORED
          from hashlib import sha256
          import sys
          apk=Path(sys.argv[1]);output=Path(sys.argv[2]);data=apk.read_bytes();expected='9c3c75249a96b4d5e00f2de516b72c132300f4b5941e8950ea11a86ee33097d4'
          assert len(data)==99183156 and sha256(data).hexdigest()==expected
          notes='던전크러시! 2.9.7 설치 및 공유 안내\r\n\r\n1. ZIP 압축을 풉니다.\r\n2. DungeonCrush-2.9.7.apk 파일을 눌러 기존 던전크러시에 업데이트 설치합니다.\r\n3. 기존 캐릭터 기록을 유지하려면 앱을 삭제하지 마세요.\r\n4. 친구도 같은 2.9.7 버전을 설치하세요.\r\n5. 같은 Wi-Fi에 연결하고 한 명이 방을 만든 뒤 친구는 방장 IP와 4자리 코드로 참가합니다.\r\n\r\n집사 사절과 별도로 설치되는 던전크러시 앱입니다.\r\nAPK SHA256: '+expected+'\r\n'
          with ZipFile(output,'w',compression=ZIP_STORED) as z:
              for name,content in [(apk.name,data),('INSTALL-KO.txt',b'\xef\xbb\xbf'+notes.encode('utf-8'))]:
                  item=ZipInfo(name,date_time=(2026,11,7,0,0,0));item.create_system=3;item.external_attr=0o100644<<16;item.compress_type=ZIP_STORED;z.writestr(item,content)
          with ZipFile(output) as z:
              assert z.testzip() is None and z.namelist()==[apk.name,'INSTALL-KO.txt']
              assert sha256(z.read(apk.name)).hexdigest()==expected
          print('Verified share ZIP:',output.name,output.stat().st_size,sha256(output.read_bytes()).hexdigest())
          PY
      - name: Prepare reviewed inventory and HUD images
        run: |
          mkdir ui
          cp previews/menu-split-1280-inventory.png ui/DungeonCrush-2.9.7-Inventory.png
          cp previews/menu-split-640-inventory.png ui/DungeonCrush-2.9.7-Compact.png
      - name: Prepare install notes
        run: |
          cat > release-notes.md <<'EOF'
          던전크러시! 2.9.7 착용 장비 최우선 정렬 패치입니다.

          설치: APK를 눌러 기존 앱에 업데이트하세요. 캐릭터 기록을 유지하려면 기존 앱을 삭제하지 마세요.
          공유: ZIP을 풀고 안의 APK를 설치하세요.

          - 착용 중인 장비가 무조건 맨 위이며, 착용/미착용 그룹 안에서 각각 등급순으로 정렬합니다.
          - 착용 중인 일반 장비도 미착용 에픽보다 항상 위에 표시합니다.
          - 오름차순/내림차순과 레벨/강화/획득 기준을 바꿔도 착용 우선·등급 우선은 유지됩니다. 추가 기준은 같은 등급 안에서만 적용합니다.
          - 강화 대상 목록도 같은 규칙을 사용합니다. 장착/해제하면 순서가 즉시 다시 계산됩니다.
          - 저장된 장비 순서·잠금·착용 정보·강화·성장 기록은 바꾸지 않습니다. 기존 좌우 메뉴·그래픽·전투·NPC·파티 기능을 유지합니다. 집사 사절은 변경하지 않았습니다.

          205개 장비와 모든 기준/양방향 정렬, 실제 가방의 착용 6개 우선 표시를 검사했습니다. JavaScript 13개·실제 TCP 4인 연결·Chromium 15개 시나리오 및 APK 서명/포함 파일/공개 해시 검증을 통과한 파일입니다. 첨부 화면은 검수 캐릭터이며 실제 휴대폰 검증은 별도입니다.
          검증 빌드: https://github.com/ohohhyun/CatHome/actions/runs/42330052474
          APK SHA256: 9c3c75249a96b4d5e00f2de516b72c132300f4b5941e8950ea11a86ee33097d4
          EOF
      - name: Publish direct install, share ZIP and UI comparisons
        run: |
          if gh release view dungeon-crush-v2.9.7 >/dev/null 2>&1; then
            gh release download dungeon-crush-v2.9.7 --pattern DungeonCrush-2.9.7.apk --dir existing
            cmp apk/DungeonCrush-2.9.7.apk existing/DungeonCrush-2.9.7.apk
            gh release upload dungeon-crush-v2.9.7 DungeonCrush-2.9.7-Share.zip ui/*.png --clobber
          else
            gh release create dungeon-crush-v2.9.7 apk/DungeonCrush-2.9.7.apk DungeonCrush-2.9.7-Share.zip ui/*.png --target "$GITHUB_SHA" --title '던전크러시! 2.9.7 — 착용 장비 최우선 정렬' --notes-file release-notes.md --prerelease
          fi
      - name: Verify every public download against checked files
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/dungeon-crush-v2.9.7" > release-assets.json
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          release=json.loads(Path('release-assets.json').read_text());assets={a['name']:a for a in release['assets']};images=list(Path('ui').glob('*.png'));assert len(images)==2
          for p in [Path('apk/DungeonCrush-2.9.7.apk'),Path('DungeonCrush-2.9.7-Share.zip'),*images]:
              a=assets[p.name];assert a['size']==p.stat().st_size and a['digest']=='sha256:'+sha256(p.read_bytes()).hexdigest(),p.name
          print('Verified published original APK, mandatory share ZIP and all reviewed UI images.')
          PY
