name: Publish Dungeon Crush direct APK
on:
  workflow_dispatch:
  push:
    branches: [codex/ashen-rift-apk]
    paths: ['.github/workflows/publish-dungeon-crush.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the already verified 2.9.2 APK
        run: gh run download 42264284734 --name DungeonCrush-APK --dir apk
      - name: Verify exact APK bytes and archive integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          p = Path('apk/DungeonCrush-2.9.2.apk')
          assert p.stat().st_size == 97297283
          assert sha256(p.read_bytes()).hexdigest() == 'bcfb46ded4606ad6b627b67224de3401f4ad1aa7fefb1563f633b062b4094b8b'
          with ZipFile(p) as z:
              assert z.testzip() is None
              assert 'AndroidManifest.xml' in z.namelist()
              assert len([n for n in z.namelist() if n.startswith('assets/art/advanced/') and n.endswith('.webp')]) == 5
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion29/') and n.endswith('.webp')]) == 85
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion292/') and n.endswith('.webp')]) == 4
              assert len([n for n in z.namelist() if n.startswith('assets/art/generated/') and n.endswith('.png')]) == 0
          print('Verified original signed Dungeon Crush 2.9.2 APK; no rebuild or repackaging.')
          PY
      - name: Package verified APK as a shareable ZIP
        run: |
          python3 - apk/DungeonCrush-2.9.2.apk DungeonCrush-2.9.2-Share.zip <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_STORED
          from hashlib import sha256
          import sys
          apk=Path(sys.argv[1]); output=Path(sys.argv[2]); data=apk.read_bytes()
          expected='bcfb46ded4606ad6b627b67224de3401f4ad1aa7fefb1563f633b062b4094b8b'
          assert len(data)==97297283 and sha256(data).hexdigest()==expected
          notes='던전크러시! 2.9.2 설치 및 공유 안내\r\n\r\n1. ZIP 압축을 풉니다.\r\n2. DungeonCrush-2.9.2.apk 파일을 눌러 Android에 설치합니다.\r\n3. 친구도 같은 2.9.2 버전을 설치하세요.\r\n4. 같은 Wi-Fi에 연결한 뒤 한 명이 방을 만들고, 나머지는 방장 IP와 4자리 방 코드로 참가합니다.\r\n\r\n기존 집사 사절과 별도로 설치되는 던전크러시 앱입니다.\r\nAPK SHA256: '+expected+'\r\n'
          with ZipFile(output,'w',compression=ZIP_STORED) as z:
              for name,content in [(apk.name,data),('INSTALL-KO.txt',b'\xef\xbb\xbf'+notes.encode('utf-8'))]:
                  entry=ZipInfo(name,date_time=(2026,11,7,0,0,0));entry.create_system=3;entry.external_attr=0o100644<<16;entry.compress_type=ZIP_STORED
                  z.writestr(entry,content)
          with ZipFile(output) as z:
              assert z.testzip() is None and z.namelist()==[apk.name,'INSTALL-KO.txt']
              assert sha256(z.read(apk.name)).hexdigest()==expected
          print('Verified share ZIP:',output.name,output.stat().st_size,sha256(output.read_bytes()).hexdigest())
          PY
      - name: Download real combat recording
        run: gh run download 42264284734 --name DungeonCrush-Coherent-Previews --dir previews
      - name: Prepare a playable preview
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -hide_banner -loglevel error -y -i previews/coherent-gameplay.webm -vf 'scale=1280:-2' -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart -an DungeonCrush-2.9.2-motion.mp4
            echo 'DUNGEON_PREVIEW_FILE=DungeonCrush-2.9.2-motion.mp4' >> "$GITHUB_ENV"
          else
            cp previews/coherent-gameplay.webm DungeonCrush-2.9.2-motion.webm
            echo 'DUNGEON_PREVIEW_FILE=DungeonCrush-2.9.2-motion.webm' >> "$GITHUB_ENV"
          fi
      - name: Prepare install notes
        run: |
          cat > release-notes.md <<'EOF'
          던전크러시! 2.9.2 달리기·점프·대시 수정 APK와 공유용 ZIP입니다.

          바로 설치: DungeonCrush-2.9.2.apk를 누르세요.
          친구에게 파일 전달: DungeonCrush-2.9.2-Share.zip을 보내고, 압축을 푼 뒤 안의 APK를 설치하세요. 설치 안내문도 포함했습니다.
          기존 2.9와 같은 서명·앱 ID·저장 형식입니다. 파티원 모두 2.9.2 업데이트를 권장합니다.

          - 네 직업의 달리기 그림을 하나의 연속된 원화로 교체하고, 상체는 고정하고 하체만 이어 그립니다. 서로 다른 그림을 섞거나 렌더 간 속도 변화로 몸을 튕기던 경로를 제거했습니다.
          - 점프는 점프 8자세만, 대시는 준비·이동·복귀 4자세만 사용합니다. 실제 동작 타이머가 우선하며 공중 대시의 높이도 유지합니다.
          - 기본 이동 그림과 본인 기본 공격·시전 그림을 입장 전에 준비해 유지합니다. 첫 점프·대시에 이전 걷기 리그가 나오는 경로를 제거했습니다.
          - 그림 수를 부풀리던 잘못된 중간 자세를 제외해 캐릭터 유효 자세는 496개입니다. 기본 3연타·시전과 몬스터는 기존 24자세를 유지합니다.
          - 실제 렌더링한 상체 픽셀, 네 직업의 첫 이동 점프·대시, 양방향과 캐시 압박을 검사했습니다. 2.9.1의 확대·연장된 스킬과 몬스터 사망 시 시전 취소도 유지합니다.
          - 기존 4직업·성장·장비·파티 경험치·본인 피해 숫자·HP·50% 회복/180초 물약·같은 Wi-Fi 최대 4인 협동을 유지합니다.

          함께 올린 영상은 실제 게임을 자동 조작한 브라우저 녹화입니다. 실제 휴대폰 촬영·장시간 성능 검증은 별도입니다.
          집사 사절은 변경하지 않았습니다.
          검증 빌드: https://github.com/ohohhyun/CatHome/actions/runs/42264284734
          APK SHA256: bcfb46ded4606ad6b627b67224de3401f4ad1aa7fefb1563f633b062b4094b8b
          EOF
      - name: Publish direct install and combat preview downloads
        run: |
          if gh release view dungeon-crush-v2.9.2 >/dev/null 2>&1; then
            gh release download dungeon-crush-v2.9.2 --pattern DungeonCrush-2.9.2.apk --dir existing
            cmp apk/DungeonCrush-2.9.2.apk existing/DungeonCrush-2.9.2.apk
            gh release upload dungeon-crush-v2.9.2 "$DUNGEON_PREVIEW_FILE" DungeonCrush-2.9.2-Share.zip --clobber
          else
            gh release create dungeon-crush-v2.9.2 apk/DungeonCrush-2.9.2.apk "$DUNGEON_PREVIEW_FILE" DungeonCrush-2.9.2-Share.zip --target "$GITHUB_SHA" --title '던전크러시! 2.9.2 — 달리기 떨림·점프·대시 수정' --notes-file release-notes.md --prerelease
          fi
      - name: Confirm release assets
        run: |
          gh release view dungeon-crush-v2.9.2 --json url,tagName,assets
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/dungeon-crush-v2.9.2" > release-assets.json
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json,os
          release=json.loads(Path('release-assets.json').read_text());assets={a['name']:a for a in release['assets']}
          for name in ['apk/DungeonCrush-2.9.2.apk','DungeonCrush-2.9.2-Share.zip',os.environ['DUNGEON_PREVIEW_FILE']]:
              p=Path(name);a=assets[p.name];assert a['size']==p.stat().st_size;assert a['digest']=='sha256:'+sha256(p.read_bytes()).hexdigest(),p.name
          print('Verified published APK, mandatory share ZIP and recording against local signed/checked bytes.')
          PY
