name: Publish Dungeon Crush direct APK
on:
  workflow_dispatch:
  push:
    branches: [codex/ashen-rift-apk]
    paths: ['.github/workflows/publish-dungeon-crush.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the already verified 2.9.1 APK
        run: gh run download 42251175699 --name DungeonCrush-APK --dir apk
      - name: Verify exact APK bytes and archive integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          p = Path('apk/DungeonCrush-2.9.1.apk')
          assert p.stat().st_size == 109023951
          assert sha256(p.read_bytes()).hexdigest() == 'ce53438ce46971d57f2b7a8ad4e99f4bbf2d1e4edd9763632667233535dccc98'
          with ZipFile(p) as z:
              assert z.testzip() is None
              assert 'AndroidManifest.xml' in z.namelist()
              assert len([n for n in z.namelist() if n.startswith('assets/art/advanced/') and n.endswith('.webp')]) == 5
              assert len([n for n in z.namelist() if n.startswith('assets/art/motion29/') and n.endswith('.webp')]) == 101
              assert len([n for n in z.namelist() if n.startswith('assets/art/generated/') and n.endswith('.png')]) == 0
          print('Verified original signed Dungeon Crush 2.9.1 APK; no rebuild or repackaging.')
          PY
      - name: Package verified APK as a shareable ZIP
        run: |
          python3 - apk/DungeonCrush-2.9.1.apk DungeonCrush-2.9.1-Share.zip <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_STORED
          from hashlib import sha256
          import sys
          apk=Path(sys.argv[1]); output=Path(sys.argv[2]); data=apk.read_bytes()
          expected='ce53438ce46971d57f2b7a8ad4e99f4bbf2d1e4edd9763632667233535dccc98'
          assert len(data)==109023951 and sha256(data).hexdigest()==expected
          notes='던전크러시! 2.9.1 설치 및 공유 안내\r\n\r\n1. ZIP 압축을 풉니다.\r\n2. DungeonCrush-2.9.1.apk 파일을 눌러 Android에 설치합니다.\r\n3. 친구도 같은 2.9.1 버전을 설치하세요.\r\n4. 같은 Wi-Fi에 연결한 뒤 한 명이 방을 만들고, 나머지는 방장 IP와 4자리 방 코드로 참가합니다.\r\n\r\n기존 집사 사절과 별도로 설치되는 던전크러시 앱입니다.\r\nAPK SHA256: '+expected+'\r\n'
          with ZipFile(output,'w',compression=ZIP_STORED) as z:
              for name,content in [(apk.name,data),('INSTALL-KO.txt',b'\xef\xbb\xbf'+notes.encode('utf-8'))]:
                  entry=ZipInfo(name,date_time=(2026,11,7,0,0,0));entry.create_system=3;entry.external_attr=0o100644<<16;entry.compress_type=ZIP_STORED
                  z.writestr(entry,content)
          with ZipFile(output) as z:
              assert z.testzip() is None and z.namelist()==[apk.name,'INSTALL-KO.txt']
              assert sha256(z.read(apk.name)).hexdigest()==expected
          print('Verified share ZIP:',output.name,output.stat().st_size,sha256(output.read_bytes()).hexdigest())
          PY
      - name: Download real combat recording
        run: gh run download 42251175699 --name DungeonCrush-RunFix-Previews --dir previews
      - name: Prepare a playable preview
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -hide_banner -loglevel error -y -i previews/runfix-gameplay.webm -vf 'scale=1280:-2' -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart -an DungeonCrush-2.9.1-combat.mp4
            echo 'DUNGEON_PREVIEW_FILE=DungeonCrush-2.9.1-combat.mp4' >> "$GITHUB_ENV"
          else
            cp previews/runfix-gameplay.webm DungeonCrush-2.9.1-combat.webm
            echo 'DUNGEON_PREVIEW_FILE=DungeonCrush-2.9.1-combat.webm' >> "$GITHUB_ENV"
          fi
      - name: Prepare install notes
        run: |
          cat > release-notes.md <<'EOF'
          던전크러시! 2.9.1 달리기·스킬·몬스터 시전 수정 APK와 공유용 ZIP입니다.

          바로 설치: DungeonCrush-2.9.1.apk를 누르세요.
          친구에게 파일 전달: DungeonCrush-2.9.1-Share.zip을 보내고, 압축을 푼 뒤 안의 APK를 설치하세요. 설치 안내문도 포함했습니다.
          기존 2.9와 같은 서명·앱 ID·저장 형식입니다. 파티원 모두 2.9.1 업데이트를 권장합니다.

          - 반복된 발 동작을 한 보폭으로 정리하고 자세마다 머리/몸 기준 위치를 맞췄습니다. 달리기·회피의 중복 몸체 잔상과 무적 중 투명도 깜빡임을 제거했습니다.
          - 짧은 출발 가속, 전방 기울기, 정지 복귀, 발 디딤 먼지와 가속 속도선을 적용했습니다. 달리기는 320 거리당 좌우 두 발 디딤입니다.
          - 주요 범위·베기 스킬 그림 약 25% 확대 및 지속 약 0.9초, 각성 1.8초로 늘렸습니다. 많은 타격 효과가 각성 연출을 즉시 지우지 않도록 했습니다.
          - 보스·법사·일반 몬스터가 죽으면 시전 예약·공격 예고·남은 마법탄을 취소합니다. 살아 있는 시전자가 없는 과거 예약도 발동하지 않습니다.
          - 기존 4직업·성장·장비·파티 경험치·본인 피해 숫자·HP·50% 회복/180초 물약·같은 Wi-Fi 최대 4인 협동을 유지합니다.

          함께 올린 영상은 실제 게임을 자동 조작한 브라우저 녹화입니다. 실제 휴대폰 촬영·장시간 성능 검증은 별도입니다.
          집사 사절은 변경하지 않았습니다.
          검증 빌드: https://github.com/ohohhyun/CatHome/actions/runs/42251175699
          APK SHA256: ce53438ce46971d57f2b7a8ad4e99f4bbf2d1e4edd9763632667233535dccc98
          EOF
      - name: Publish direct install and combat preview downloads
        run: |
          if gh release view dungeon-crush-v2.9.1 >/dev/null 2>&1; then
            gh release download dungeon-crush-v2.9.1 --pattern DungeonCrush-2.9.1.apk --dir existing
            cmp apk/DungeonCrush-2.9.1.apk existing/DungeonCrush-2.9.1.apk
            gh release upload dungeon-crush-v2.9.1 "$DUNGEON_PREVIEW_FILE" DungeonCrush-2.9.1-Share.zip --clobber
          else
            gh release create dungeon-crush-v2.9.1 apk/DungeonCrush-2.9.1.apk "$DUNGEON_PREVIEW_FILE" DungeonCrush-2.9.1-Share.zip --target "$GITHUB_SHA" --title '던전크러시! 2.9.1 — 달리기·스킬·사후 공격 수정' --notes-file release-notes.md --prerelease
          fi
      - name: Confirm release assets
        run: |
          gh release view dungeon-crush-v2.9.1 --json url,tagName,assets
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/dungeon-crush-v2.9.1" > release-assets.json
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json,os
          release=json.loads(Path('release-assets.json').read_text());assets={a['name']:a for a in release['assets']}
          for name in ['apk/DungeonCrush-2.9.1.apk','DungeonCrush-2.9.1-Share.zip',os.environ['DUNGEON_PREVIEW_FILE']]:
              p=Path(name);a=assets[p.name];assert a['size']==p.stat().st_size;assert a['digest']=='sha256:'+sha256(p.read_bytes()).hexdigest(),p.name
          print('Verified published APK, mandatory share ZIP and recording against local signed/checked bytes.')
          PY
