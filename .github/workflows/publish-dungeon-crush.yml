name: Publish Dungeon Crush direct APK
on:
  workflow_dispatch:
  push:
    branches: [codex/ashen-rift-apk]
    paths: ['.github/workflows/publish-dungeon-crush.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the already verified 2.8 APK
        run: gh run download 42215740250 --name DungeonCrush-APK --dir apk
      - name: Verify exact APK bytes and archive integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          p = Path('apk/DungeonCrush-2.8.apk')
          assert p.stat().st_size == 26595825
          assert sha256(p.read_bytes()).hexdigest() == '81d15311d3cb3d191bea5dd235b04db2fcab1c61f377f7163a5e7dfdfefe72f3'
          with ZipFile(p) as z:
              assert z.testzip() is None
              assert 'AndroidManifest.xml' in z.namelist()
              assert len([n for n in z.namelist() if n.startswith('assets/art/advanced/') and n.endswith('.webp')]) == 14
              assert len([n for n in z.namelist() if n.startswith('assets/art/generated/') and n.endswith('.png')]) == 0
          print('Verified original signed Dungeon Crush 2.8 APK; no rebuild or repackaging.')
          PY
      - name: Download real combat recording
        run: gh run download 42215740250 --name DungeonCrush-Advanced-Previews --dir previews
      - name: Prepare a playable preview
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -hide_banner -loglevel error -y -i previews/advanced-combat.webm -vf 'scale=1280:-2' -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart -an DungeonCrush-2.8-combat.mp4
            echo 'DUNGEON_PREVIEW_FILE=DungeonCrush-2.8-combat.mp4' >> "$GITHUB_ENV"
          else
            cp previews/advanced-combat.webm DungeonCrush-2.8-combat.webm
            echo 'DUNGEON_PREVIEW_FILE=DungeonCrush-2.8-combat.webm' >> "$GITHUB_ENV"
          fi
      - name: Prepare install notes
        run: |
          cat > release-notes.md <<'EOF'
          던전크러시! 2.8 Android 설치 파일입니다.

          Assets에서 DungeonCrush-2.8.apk를 받아 파일을 눌러 설치하세요. 압축을 풀 필요가 없습니다. 기존 2.7과 같은 서명이며 파티원 모두 2.8을 설치해야 합니다.

          - 파티 처치 경험치 즉시 지급·저장 및 재접속/반복 패킷 중복 방지, 전투 EXP 표시
          - 본인이 가한 피해 숫자만 표시, 본인 HP 숫자 가독성 개선
          - 던전 물약: 최대 HP 50% 회복, 재사용 180초, 이동 중 사용 가능
          - 장비·공방·재료·물약 이미지 30종과 몬스터 이동·공격 64프레임 추가
          - 파티 모션 보간, 근거리 총알 누락·조준·탄두 궤적 보정
          - UI 클릭 전투음 교체, 전투용 CC0 음원 14종과 직업별 타격·스킬 소리
          - 기존 캐릭터·장비·퀘스트·숙련 저장과 싱글/최대 4인 같은 Wi-Fi 협동 유지

          함께 올린 영상은 자동으로 실제 게임을 조작해 녹화한 약 40초의 검증 영상입니다. 실제 휴대폰에서 촬영한 영상은 아닙니다.

          집사 사절은 변경하지 않았습니다.
          검증 빌드: https://github.com/ohohhyun/CatHome/actions/runs/42215740250
          APK SHA256: 81d15311d3cb3d191bea5dd235b04db2fcab1c61f377f7163a5e7dfdfefe72f3
          EOF
      - name: Publish direct install and combat preview downloads
        run: |
          if gh release view dungeon-crush-v2.8 >/dev/null 2>&1; then
            gh release download dungeon-crush-v2.8 --pattern DungeonCrush-2.8.apk --dir existing
            cmp apk/DungeonCrush-2.8.apk existing/DungeonCrush-2.8.apk
            gh release upload dungeon-crush-v2.8 "$DUNGEON_PREVIEW_FILE" --clobber
          else
            gh release create dungeon-crush-v2.8 apk/DungeonCrush-2.8.apk "$DUNGEON_PREVIEW_FILE" --target "$GITHUB_SHA" --title '던전크러시! 2.8 — 파티 경험치·물약·전투 개선' --notes-file release-notes.md --prerelease
          fi
      - name: Confirm release assets
        run: gh release view dungeon-crush-v2.8 --json url,tagName,assets
