name: Publish Dungeon Crush direct APK
on:
  workflow_dispatch:
  push:
    branches: [codex/ashen-rift-apk]
    paths: ['.github/workflows/publish-dungeon-crush.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: dungeon-crush-v2.15.0-rc1
      DUNGEON_RELEASE_SOURCE: f616e095a66be0d3d31c8e030d9022b3cad536e3
      DUNGEON_RELEASE_RUN: '43366493827'
      DUNGEON_RELEASE_ID: '443896807'
      DUNGEON_APK_BYTES: '482231241'
      DUNGEON_APK_SHA256: e8af843d3462e8a28ebed202faeed6d7d787b392a77a22452e544a4aba8369ef
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f616e095a66be0d3d31c8e030d9022b3cad536e3
      - name: Require the exact successful build and unpublished release
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/$DUNGEON_RELEASE_RUN --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/$DUNGEON_RELEASE_RUN --jq .head_sha)" = "$DUNGEON_RELEASE_SOURCE"
          test "$(gh api repos/$GH_REPO/git/ref/tags/$RELEASE_TAG --jq .object.sha)" = "$DUNGEON_RELEASE_SOURCE"
          test "$(gh api repos/$GH_REPO/releases/$DUNGEON_RELEASE_ID --jq .tag_name)" = "$RELEASE_TAG"
          test "$(gh api repos/$GH_REPO/releases/$DUNGEON_RELEASE_ID --jq .draft)" = true
      - uses: actions/download-artifact@v4
        with:
          name: DungeonCrush-APK
          run-id: 43366493827
          github-token: ${{ github.token }}
          path: apk
      - name: Verify exact signed APK, all 36 illustrations and compatible ZIP
        run: python3 dungeon-crush/tools/package-release.py
      - name: Publish verified persistent download
        run: |
          cat > release-notes.md <<'NOTES'
          던전크러시! 2.15.0 원화 · 외형 미리보기 수정판 (versionCode 42).

          아래 Assets에서 **DungeonCrush-2.15.0-RC1.zip**을 받아 압축을 풀고 APK를 설치하세요. 기존 앱을 삭제하지 말고 업데이트 설치하세요.

          - 캐릭터 선택과 외형 상품 상세에 기본 6명·외형 30벌의 일러스트 36장을 넣었습니다. 해당 캐릭터의 의상과 무기를 원화에서 확인할 수 있습니다.
          - 상품 상세에서 원화·동작·스킬 효과를 전환하고 구매·장착·해제합니다. 휴대폰의 상점 너비, 동작 선택, 고정 구매 버튼과 확대 글자 배치를 정리했습니다.
          - 동작별 자동 카메라 배율 변경을 고쳤습니다. 대기/달리기/공격/점프/회피/스킬이 같은 기본 배율을 사용합니다. 큰 효과는 직접 넓게 보고 기본 배율로 돌아옵니다.
          - 외형 30벌의 실제 장착·해제 후 마을/전투 몸 크기와 기본 6명을 비교했습니다. 모션 영상을 확인하고 원화/스프라이트 로딩 실패·재시도, 저장과 4인 통신을 검사했습니다.
          - 전체 **55개 자동 검사**(코드25 + Java2 + Chrome28), APK/AAB·Android lint·기존 서명·최종 포함 리소스 검증을 통과했습니다.
          - 외형·펫은 실제 결제 없는 무료 테스트 구매입니다. 48던전·4정예 레이드·24배경과 판매 보호·백업을 유지합니다.

          저장 형식 2와 Wi-Fi 프로토콜 10을 유지합니다. 집사 사절 원본과 서버/DB는 수정하지 않았습니다. 실기기 장시간 FPS·발열과 스토어 등록은 별도입니다.
          검증 소스: f616e095a66be0d3d31c8e030d9022b3cad536e3
          검증 빌드: https://github.com/ohohhyun/CatHome/actions/runs/43366493827
          APK SHA256: e8af843d3462e8a28ebed202faeed6d7d787b392a77a22452e544a4aba8369ef
          NOTES
          gh release upload "$RELEASE_TAG" DungeonCrush-2.15.0-RC1.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --notes-file release-notes.md
      - name: Verify public ZIP size and digest
        run: |
          gh api "repos/$GH_REPO/releases/$DUNGEON_RELEASE_ID" > release-assets.json
          python3 - <<'PYCODE'
          from pathlib import Path
          from hashlib import sha256
          import json
          p=Path('DungeonCrush-2.15.0-RC1.zip');r=json.loads(Path('release-assets.json').read_text());assert not r['draft']
          a=next(a for a in r['assets'] if a['name']==p.name)
          assert a['size']==p.stat().st_size and a['digest']=='sha256:'+sha256(p.read_bytes()).hexdigest()
          print('Verified public ZIP:',a['browser_download_url'])
          PYCODE
