name: Nameless Crown APK (Godot)
on:
  workflow_dispatch:
  push:
    branches: [nameless-crown-dev]
    paths:
      - 'NamelessCrown/**'
      - '.github/workflows/nameless-crown-apk.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify original Godot project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p NamelessCrown/game NamelessCrown/dist
          cat NamelessCrown/packed/part_*.bin > "$RUNNER_TEMP/crown-project.zip"
          echo "a2c454cbc6116da17cf34f0f13a5f6e188e5ce4477f64f62141577a8071cc6cc  $RUNNER_TEMP/crown-project.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/crown-project.zip" -d "$RUNNER_TEMP/crown-unpacked"
          cp -a "$RUNNER_TEMP/crown-unpacked/NamelessCrown_v0.6/." NamelessCrown/game/
          # Android requires ETC2/ASTC texture import even for the Compatibility renderer.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NamelessCrown/game/project.godot")
          s = p.read_text(encoding="utf-8")
          option = "textures/vram_compression/import_etc2_astc=true"
          if option not in s:
              s = s.replace("[rendering]\n", "[rendering]\n" + option + "\n", 1)
          if option not in s:
              raise SystemExit("Missing [rendering] section in Godot config")
          p.write_text(s, encoding="utf-8")
          PY
          test -f NamelessCrown/game/project.godot
          test -f NamelessCrown/game/export_presets.cfg
          test -f NamelessCrown/game/scenes/main.tscn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline data and route checks
        run: |
          python3 -m pip install --quiet Pillow
          python3 NamelessCrown/game/qa/audit.py
          python3 NamelessCrown/game/qa/source_syntax_audit.py
          python3 NamelessCrown/game/qa/route_model_audit.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.2'
          use-dotnet: false
          include-templates: true
      - name: Import resources and check GDScript
        shell: bash
        run: |
          set -o pipefail
          godot --version
          godot --headless --editor --path NamelessCrown/game --import --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E "(SCRIPT ERROR|Parser Error|Parse Error|Failed to load script)" "$RUNNER_TEMP/godot-import.log"; then
            echo 'Godot parsing failed'
            exit 1
          fi
      - name: Run engine-level scene smoke tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path NamelessCrown/game --script res://qa/smoke.gd 2>&1 | tee "$RUNNER_TEMP/godot-smoke.log"
          if grep -E "(SCRIPT ERROR|Parser Error|Parse Error|Failed to load script|FAIL:)" "$RUNNER_TEMP/godot-smoke.log"; then
            exit 1
          fi
          grep -q "SMOKE PASS" "$RUNNER_TEMP/godot-smoke.log"
      - name: Create local debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          python3 NamelessCrown/game/ci/configure_android.py
      - name: Export Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          godot --headless --path NamelessCrown/game --export-debug Android "$GITHUB_WORKSPACE/NamelessCrown/dist/NamelessCrown-debug.apk"
          test -s NamelessCrown/dist/NamelessCrown-debug.apk
          file NamelessCrown/dist/NamelessCrown-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NamelessCrown-Android-APK
          path: NamelessCrown/dist/NamelessCrown-debug.apk
          if-no-files-found: error
          retention-days: 30
