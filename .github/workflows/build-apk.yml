name: Build installable APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check game logic
        run: |
          node tests/skins.test.cjs
          node tests/crazy.test.cjs
          node tests/prototype.test.cjs
      - name: Install Korean preview fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Install browser test library
        run: npm install --prefix "$RUNNER_TEMP/cathome-ui" --no-package-lock --no-audit --no-fund playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Check mobile mode selection in browser
        run: |
          node tests/browser.test.cjs
          node tests/crazy-browser.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
          SKIN_REVIEW: '1'
      - name: Compare render workload with v0.4
        run: node tests/performance.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cathome-ui/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CatHome-Menu-Previews
          path: build/previews/*.png
          if-no-files-found: ignore
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Gradle Wrapper
        run: echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Preserve test APK signing key
        uses: actions/cache@v4
        with:
          path: .signing/debug.keystore
          key: cathome-debug-signing-explicit-v1
      - name: Prepare reusable test signing key
        run: |
          mkdir -p .signing
          if [ ! -f .signing/debug.keystore ]; then
            keytool -genkeypair -keystore .signing/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build APK
        run: bash gradlew assembleDebug --no-daemon
        env:
          CATHOME_DEBUG_KEYSTORE: ${{ github.workspace }}/.signing/debug.keystore
      - name: Verify installable APK and signer
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk'

      - uses: actions/upload-artifact@v4
        with:
          name: CatHome-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
